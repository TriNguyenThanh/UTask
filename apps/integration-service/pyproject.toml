[project]
name = "utask-integration-service"
version = "0.1.0"
description = "Integration backend for UTask"
requires-python = ">=3.11,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.17.2,<3.18",
    "psycopg[binary]>=3.2,<4",
    "gunicorn>=26,<27",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-django>=4.11,<5",
    "jsonschema>=4.26,<5",
    "PyYAML>=6.0.3,<7",
    "openapi-spec-validator>=0.7,<0.9",
    "ruff>=0.16.8,<0.17",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "unit: health, configuration and startup behavior without a database",
    "integration: behavior with the isolated Integration PostgreSQL database",
    "contract: HTTP contracts",
]
