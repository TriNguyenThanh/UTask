[project]
name = "utask-notification-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["Django>=5.1,<5.2", "psycopg[binary]>=3.2,<3.3"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-django>=4.9,<5", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-ignore = ["RUF012"]
