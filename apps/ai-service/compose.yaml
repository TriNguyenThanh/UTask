# Stack local của riêng AI Service; không thay thế Compose/gateway toàn hệ thống.
x-ai: &ai
  build: .
  image: utask/ai-service:local
  env_file:
    - ../../infra/env/ai-service.env
  extra_hosts:
    - host.docker.internal:host-gateway
  init: true

services:
  database:
    image: postgres:17-alpine
    env_file: ../../infra/env/database.env
    volumes:
      - ai-database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  broker:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    <<: *ai
    ports:
      - "127.0.0.1:${AI_HTTP_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3

  worker:
    <<: *ai
    command: [celery, -A, jobs.celery_app:celery_app, worker, --loglevel=INFO, "--concurrency=${AI_WORKER_CONCURRENCY:-2}"]
    depends_on:
      api:
        condition: service_healthy
      broker:
        condition: service_healthy

  dispatcher:
    <<: *ai
    command: [python, -m, jobs.dispatcher]
    depends_on:
      api:
        condition: service_healthy
      broker:
        condition: service_healthy

  beat:
    <<: *ai
    command: [celery, -A, jobs.celery_app:celery_app, beat, --loglevel=INFO, --schedule=/tmp/ai-beat-schedule, --pidfile=/tmp/ai-beat.pid]
    depends_on:
      api:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import os; from pathlib import Path; os.kill(int(Path('/tmp/ai-beat.pid').read_text()), 0)"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  ai-database:
