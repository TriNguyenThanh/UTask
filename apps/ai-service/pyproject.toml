[project]
name = "utask-ai-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "google-adk>=1.0,<2", "pydantic>=2.10,<3", "uvicorn>=0.32,<1"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
