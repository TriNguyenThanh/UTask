[project]
name = "utask-core-service"
version = "0.1.0"
description = "Unified Core Modular Monolith (Identity, Classroom, Work) for UTask"
requires-python = ">=3.11,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.17.2,<3.18",
    "django-filter>=25.1,<26",
    "drf-spectacular>=0.29,<0.30",
    "psycopg[binary]>=3.2,<4",
    "PyJWT[crypto]>=2.10,<3",
    "argon2-cffi>=23.1,<26",
    "bcrypt>=4.3,<6",
    "dj-rest-auth>=7.2,<8",
    "django-allauth[socialaccount]>=65,<66",
    "django-axes>=8.3,<9",
    "djangorestframework-simplejwt>=5.5.1,<6",
    "requests>=2.32,<3",
    "celery[redis]>=5.5,<6",
    "confluent-kafka>=2.11,<3",
    "gunicorn>=26,<27",
    "boto3>=1.40,<2",
    "nh3>=0.3,<0.4",
    "beautifulsoup4>=4.13,<5",
    "filetype>=1.2,<2",
]

[dependency-groups]
dev = [
    "coverage>=7.10,<8",
    "jsonschema[format-nongpl]>=4.26,<5",
    "pytest>=9.0.3,<10",
    "pytest-django>=4.11,<5",
    "ruff>=0.16.8,<0.17",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "common", "config", "infrastructure"]

[tool.pytest.ini_options]
addopts = '--strict-markers --strict-config -m "not external and not e2e"'
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "unit: isolated application logic without database or network access",
    "integration: application behavior with database or service dependencies",
    "contract: response, route, schema and framework configuration contracts",
    "postgres: PostgreSQL concurrency and constraint behavior",
    "http: HTTP integration tests using pytest-django live_server",
    "external: real external backend dependencies",
    "e2e: real gateway and multi-service stack",
    "case_id(*ids): related API specification test-case IDs",
]

[tool.coverage.run]
branch = true
source = ["apps", "common", "infrastructure"]
omit = ["*/migrations/*", "*/management/*"]

[tool.coverage.report]
show_missing = true
precision = 2
