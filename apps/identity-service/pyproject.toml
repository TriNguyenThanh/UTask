[project]
name = "utask-identity-service"
version = "0.1.0"
description = "Identity Service foundation for UTask"
requires-python = ">=3.11,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
    "PyJWT[crypto]>=2.10,<3",
    "argon2-cffi>=23.1,<26",
    "dj-rest-auth>=7.2,<8",
    "django-allauth[socialaccount]>=65,<66",
    "bcrypt>=4.3,<6",
    "redis>=6,<8",
    "django-axes>=8.3,<9",
    "djangorestframework-simplejwt>=5.5.1,<6",
    "boto3>=1.40,<2",
    "drf-spectacular>=0.29,<0.30",
]

[dependency-groups]
dev = [
    "coverage>=7.10,<8",
    "jsonschema[format-nongpl]>=4.26,<5",
    "pytest>=8.4,<9",
    "pytest-django>=4.11,<5",
    "requests>=2.32,<3",
    "ruff>=0.16.8,<0.17",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
markers = [
    "unit: isolated application logic without database or network access",
    "integration: application behavior with database or service dependencies",
    "contract: response, route, schema and framework configuration contracts",
    "postgres: tests that require PostgreSQL",
    "http: HTTP integration tests using pytest-django live_server",
    "case_id(*ids): related Identity API specification test-case IDs",
]

[tool.coverage.run]
branch = true
source = ["accounts", "authentication", "common", "messaging"]
omit = ["*/migrations/*", "*/management/*"]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 90
