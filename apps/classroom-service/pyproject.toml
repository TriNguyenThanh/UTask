[project]
name = "utask-classroom-service"
version = "0.1.0"
description = "Classroom backend for UTask"
requires-python = ">=3.11,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.17.2,<3.18",
    "django-filter>=25.1,<26",
    "drf-spectacular>=0.29,<0.30",
    "psycopg[binary]>=3.2,<4",
    "PyJWT[crypto]>=2.10,<3",
    "requests>=2.32,<3",
    "celery[redis]>=5.5,<6",
    "confluent-kafka>=2.10,<3",
    "gunicorn>=26,<27",
]

[dependency-groups]
dev = ["pytest>=9.0.3,<10", "pytest-django>=4.11,<5", "jsonschema>=4.26,<5", "ruff>=0.16.8,<0.17"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = '--strict-markers --strict-config -m "not external and not e2e"'
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "unit: pure application behavior",
    "integration: database and command behavior",
    "contract: HTTP and event contracts",
    "postgres: PostgreSQL concurrency and constraints",
    "external: real backend dependencies",
    "e2e: real gateway and services",
]
