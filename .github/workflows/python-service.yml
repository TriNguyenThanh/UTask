name: Python service checks

on:
  workflow_call:
    inputs:
      service:
        description: Python service directory below apps.
        required: true
        type: string
      validate_image:
        description: Build the service image without publishing it.
        required: false
        default: true
        type: boolean
      postgres:
        description: Start PostgreSQL 16 for tests (database ci, user utask_ci).
        required: false
        default: false
        type: boolean
      redis:
        description: Start Redis 7 for tests.
        required: false
        default: false
        type: boolean
      test_env:
        description: JSON object of non-secret test environment variables.
        required: false
        default: '{}'
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ inputs.postgres && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: utask_ci
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U utask_ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: ${{ inputs.redis && 'redis:7-alpine' || '' }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/${{ inputs.service }}
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install locked dependencies
        run: uv sync --all-groups --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Test, including AI evaluations when present
        env: ${{ fromJSON(inputs.test_env) }}
        run: uv run pytest
      - name: Validate Docker image
        if: inputs.validate_image
        run: docker build --tag "utask/${{ inputs.service }}:ci" .
