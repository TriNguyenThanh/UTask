name: Python service checks

on:
  workflow_call:
    inputs:
      service:
        description: Python service directory below apps.
        required: true
        type: string
      validate_image:
        description: Build the service image without publishing it.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ inputs.service == 'identity-service' && 'postgres:16-alpine' || '' }}
        env:
          POSTGRES_USER: utask_ci
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_DB: identity_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U utask_ci -d identity_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: ${{ inputs.service == 'identity-service' && 'redis:7-alpine' || '' }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/${{ inputs.service }}
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install locked dependencies
        run: uv sync --all-groups --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Test Identity with PostgreSQL and Redis
        if: inputs.service == 'identity-service'
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_USER: utask_ci
          POSTGRES_PASSWORD: ci-only-postgres-password
          DATABASE_NAME: identity_ci
          IDENTITY_TEST_DB_NAME: test_identity_ci
          IDENTITY_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: uv run pytest
      - name: Test, including AI evaluations when present
        if: inputs.service != 'identity-service'
        run: uv run pytest
      - name: Validate Docker image
        if: inputs.validate_image
        run: docker build --tag "utask/${{ inputs.service }}:ci" .
