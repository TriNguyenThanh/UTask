name: Continuous integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.services.outputs.services }}
      checks: ${{ steps.services.outputs.checks }}
      checks_needed: ${{ steps.services.outputs.checks_needed }}
      django_services: ${{ steps.services.outputs.django_services }}
      release_matrix: ${{ steps.services.outputs.release_matrix }}
      release_needed: ${{ steps.services.outputs.release_needed }}
      web_ready: ${{ steps.services.outputs.web_ready }}
      shared: ${{ steps.filter.outputs.shared }}
      web: ${{ steps.filter.outputs.web }}
      deployment: ${{ steps.filter.outputs.deployment }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: json
          filters: |
            shared:
              - '.github/workflows/**'
              - 'scripts/tests/test_staging_deployment.py'
              - 'scripts/discover_services.py'
              - 'scripts/ci_local.py'
              - 'docker-compose.yml'
              - 'docker-compose.staging.yml'
              - '.env.example'
              - 'infra/**'
              - 'contracts/**'
              - 'docs/architecture/**'
            code:
              - 'apps/**'
            web:
              - 'apps/web/**'
            deployment:
              - 'scripts/discover_services.py'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release-staging.yml'
              - 'docker-compose.staging.yml'
              - 'infra/env/*.env'
              - 'infra/nginx/nginx.conf'
              - 'infra/postgres/init-databases.sh'
              - 'datasets/**'
      - name: Discover implemented services
        id: services
        env:
          CHANGED_FILES: ${{ steps.filter.outputs.code_files }}
          SHARED_CHANGED: ${{ steps.filter.outputs.shared }}
          DEPLOYMENT_CHANGED: ${{ steps.filter.outputs.deployment }}
        run: uv run --project apps/identity-service --locked python scripts/discover_services.py

  compose-config:
    needs: changes
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROFILES: ${{ join(fromJSON(needs.changes.outputs.services), ',') }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Test deployment configuration and failure handling
        run: uv run --project apps/identity-service --locked python -m unittest discover -s scripts/tests -p test_staging_deployment.py
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - name: Validate staging Compose
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          UTASK_IMAGE_TAG: sha-${{ github.sha }}
        run: |
          export UTASK_IMAGE_PREFIX="ghcr.io/${REPOSITORY_OWNER,,}/utask"
          docker compose --env-file .env.example -f docker-compose.staging.yml config --quiet
      - run: sh -n infra/postgres/init-databases.sh
      - name: Validate Nginx configuration
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine nginx -t

  python-services:
    needs: changes
    if: needs.changes.outputs.checks_needed == 'true'
    name: Check ${{ matrix.service }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.checks) }}
    uses: ./.github/workflows/python-service.yml
    with:
      service: ${{ matrix.service }}
      validate_image: ${{ github.event_name == 'pull_request' }}
      postgres: ${{ matrix.postgres }}
      redis: ${{ matrix.redis }}
      test_env: ${{ matrix.test_env }}

  web:
    needs: changes
    if: needs.changes.outputs.web_ready == 'true' && (needs.changes.outputs.shared == 'true' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  ci-result:
    name: CI result
    needs: [changes, compose-config, python-services, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          results = json.loads(os.environ["RESULTS"])
          failed = [name for name, job in results.items() if job["result"] in ("failure", "cancelled")]
          if results["changes"]["result"] != "success" or failed:
              raise SystemExit(f"CI failed: {', '.join(failed)}")
          print("All selected checks passed")
          PY

  release-staging:
    needs:
      - changes
      - ci-result
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      needs.ci-result.result == 'success' &&
      needs.changes.outputs.release_needed == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-staging.yml
    with:
      source_sha: ${{ github.sha }}
      services: ${{ needs.changes.outputs.release_matrix }}
      migration_services: ${{ join(fromJSON(needs.changes.outputs.django_services), ' ') }}
    secrets: inherit
