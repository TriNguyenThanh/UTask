name: Release images and deploy staging

on:
  workflow_call:
    inputs:
      source_sha:
        description: Commit SHA that passed continuous integration
        required: true
        type: string
      services:
        description: Validated JSON matrix of enabled services and change flags.
        required: true
        type: string
      migration_services:
        description: Space-separated Django services discovered from project dependencies.
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  image-config:
    runs-on: ubuntu-latest
    outputs:
      namespace: ${{ steps.namespace.outputs.namespace }}
    steps:
      - name: Normalize image namespace
        id: namespace
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          printf 'namespace=ghcr.io/%s/utask\n' "${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  publish-images:
    needs: image-config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAMESPACE: ${{ needs.image-config.outputs.namespace }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.services) }}
    steps:
      - name: Check out tested commit
        if: matrix.changed == true
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push changed image
        if: matrix.changed == true
        uses: docker/build-push-action@v6
        with:
          context: ./apps/${{ matrix.service }}
          file: ./apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:main
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:sha-${{ inputs.source_sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Reuse unchanged image for this release
        if: matrix.changed != true
        env:
          IMAGE: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:sha-${SOURCE_SHA}" \
            "${IMAGE}:main"

  deploy-staging:
    needs: [image-config, publish-images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    concurrency:
      group: staging
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_WORKDIR: ${{ vars.STAGING_WORKDIR }}
      STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      STAGING_REGISTRY_USERNAME: ${{ secrets.STAGING_REGISTRY_USERNAME }}
      STAGING_REGISTRY_TOKEN: ${{ secrets.STAGING_REGISTRY_TOKEN }}
      STAGING_REGISTRY: ghcr.io
      STAGING_IMAGE_PREFIX: ${{ needs.image-config.outputs.namespace }}
      # Deploy the exact release assembled from the tested commit. Changed
      # images are built; unchanged images reuse their existing manifests.
      STAGING_IMAGE_TAG: sha-${{ inputs.source_sha }}
      STAGING_SERVICES: ${{ join(fromJSON(inputs.services).include.*.service, ' ') }}
      STAGING_MIGRATION_SERVICES: ${{ inputs.migration_services }}
    steps:
      - name: Check out tested deployment files
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Validate staging settings
        shell: bash
        run: |
          set -euo pipefail
          for variable_name in STAGING_HOST STAGING_USER STAGING_WORKDIR STAGING_KNOWN_HOSTS STAGING_SSH_PRIVATE_KEY STAGING_REGISTRY_USERNAME STAGING_REGISTRY_TOKEN; do
            if [[ -z "${!variable_name}" ]]; then
              echo "Missing required staging setting: ${variable_name}" >&2
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          key_file="$HOME/.ssh/id_ed25519"
          key_error=$(mktemp)
          trap 'rm -f "$key_error"' EXIT
          if ! LC_ALL=C ssh-keygen -y -P '' -f "$key_file" > /dev/null 2> "$key_error"; then
            if grep -Fq 'error in libcrypto' "$key_error"; then
              echo '::error::OpenSSH key validation failed: error in libcrypto. Root cause is not established.'
            elif grep -Fq 'incorrect passphrase' "$key_error"; then
              echo '::error::OpenSSH key validation failed: incorrect passphrase with an empty passphrase. This workflow has no passphrase support.'
            else
              echo '::error::OpenSSH key validation failed. Root cause is not established; key content was not modified.'
            fi
            exit 1
          else
            echo 'SSH private key is readable without a passphrase.'
          fi
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Upload deployment files
        shell: bash
        run: |
          set -euo pipefail
          target="${STAGING_USER}@${STAGING_HOST}"
          printf '%s\n' "$STAGING_WORKDIR" | ssh "$target" '
            IFS= read -r workdir
            mkdir -p -- "$workdir/infra/postgres" "$workdir/infra/nginx" "$workdir/infra/env" "$workdir/datasets"
          '
          scp docker-compose.staging.yml "$target:${STAGING_WORKDIR}/docker-compose.staging.yml"
          scp .env.example "$target:${STAGING_WORKDIR}/.env.example"
          scp infra/env/*.env "$target:${STAGING_WORKDIR}/infra/env/"
          scp infra/postgres/init-databases.sh "$target:${STAGING_WORKDIR}/infra/postgres/init-databases.sh"
          scp infra/nginx/nginx.conf "$target:${STAGING_WORKDIR}/infra/nginx/nginx.conf"
          if [[ " $STAGING_SERVICES " == *" ai-service "* ]]; then
            scp -r datasets/. "$target:${STAGING_WORKDIR}/datasets/"
          fi

      - name: Pull images and restart staging
        shell: bash
        run: |
          set -euo pipefail
          target="${STAGING_USER}@${STAGING_HOST}"
          {
            printf '%s\n' "$STAGING_REGISTRY_TOKEN"
            printf '%s\n' "$STAGING_WORKDIR"
            printf '%s\n' "$STAGING_REGISTRY"
            printf '%s\n' "$STAGING_REGISTRY_USERNAME"
            printf '%s\n' "$STAGING_IMAGE_PREFIX"
            printf '%s\n' "$STAGING_IMAGE_TAG"
            printf '%s\n' "$STAGING_SERVICES"
            printf '%s\n' "$STAGING_MIGRATION_SERVICES"
            cat <<'REMOTE_SCRIPT'
          set -euo pipefail
          printf '%s\n' "$registry_token" | docker login "$registry" --username "$registry_user" --password-stdin
          trap 'docker logout "$registry" >/dev/null 2>&1 || true' EXIT
          cd "$workdir"
          test -s .env || { echo "Missing staging .env on server" >&2; exit 1; }
          export UTASK_IMAGE_PREFIX="$image_prefix" UTASK_IMAGE_TAG="$image_tag"
          read -r -a services <<< "$service_names"
          export COMPOSE_PROFILES="${service_names// /,}"
          profiles=()
          for service in "${services[@]}"; do
            [[ "$service" =~ ^[a-z][a-z0-9-]*-service$ ]] || { echo "Invalid deploy service name" >&2; exit 1; }
            profiles+=(--profile "$service")
          done
          compose=(docker compose --env-file .env -f docker-compose.staging.yml "${profiles[@]}")
          "${compose[@]}" config --quiet
          "${compose[@]}" pull --quiet
          "${compose[@]}" up -d --no-build --wait --wait-timeout 120 postgres redis
          for service in "${services[@]}"; do
            if [[ " $migration_names " == *" $service "* ]]; then
              "${compose[@]}" run --rm --no-deps "$service" /app/.venv/bin/python manage.py migrate --noinput
            fi
          done
          "${compose[@]}" up -d --no-build --wait --wait-timeout 120
          "${compose[@]}" exec -T identity-service /app/.venv/bin/python manage.py migrate --check
          "${compose[@]}" exec -T nginx wget -q -O /dev/null --header='Host: identity-service' http://localhost/api/auth/healthz
          "${compose[@]}" ps
          REMOTE_SCRIPT
          } | ssh "$target" '
            IFS= read -r registry_token
            IFS= read -r workdir
            IFS= read -r registry
            IFS= read -r registry_user
            IFS= read -r image_prefix
            IFS= read -r image_tag
            IFS= read -r service_names
            IFS= read -r migration_names
            export registry_token workdir registry registry_user image_prefix image_tag service_names migration_names
            bash -s
          '
