name: Release images and deploy staging

on:
  workflow_call:
    inputs:
      source_sha:
        description: Commit SHA that passed continuous integration
        required: true
        type: string
      services:
        description: Validated JSON matrix of enabled services.
        required: true
        type: string
      migration_services:
        description: Space-separated Django services discovered from project dependencies.
        required: true
        type: string
      gateway_health_paths:
        description: JSON array of gateway health paths from enabled service Compose metadata.
        required: true
        type: string
      gateway_service:
        description: Active gateway declared in Compose.
        required: true
        type: string
      infrastructure_services:
        description: Space-separated infrastructure services in the active Compose dependency graph.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  image-config:
    runs-on: ubuntu-latest
    outputs:
      namespace: ${{ steps.namespace.outputs.namespace }}
    steps:
      - name: Normalize image namespace
        id: namespace
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          printf 'namespace=ghcr.io/%s/utask\n' "${REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  publish-images:
    needs: image-config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAMESPACE: ${{ needs.image-config.outputs.namespace }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.services) }}
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./apps/${{ matrix.service }}
          file: ./apps/${{ matrix.service }}/Dockerfile
          outputs: type=image,name=${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - uses: astral-sh/setup-uv@v5

      - name: Export pinned images
        env:
          IMAGE: ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}
          SERVICE: ${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          uv run --no-project --with PyYAML==6.0.3 python - <<'PY'
          import json, os, re
          from pathlib import Path
          import yaml
          digest = os.environ["DIGEST"]
          if not re.fullmatch(r"sha256:[a-f0-9]{64}", digest):
              raise SystemExit("Build returned an invalid image digest")
          service = os.environ["SERVICE"]
          compose = yaml.safe_load(Path("docker-compose.staging.yml").read_text())["services"]
          images = {name: {"image": os.environ["IMAGE"] + "@" + digest}
                    for name, config in compose.items()
                    if name == service or config.get("x-deploy", {}).get("application") == service}
          Path("release-images").mkdir(exist_ok=True)
          Path(f"release-images/{service}.json").write_text(json.dumps({"services": images}))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: release-image-${{ matrix.service }}
          path: release-images/*.json
          if-no-files-found: error
          overwrite: true

  deploy-staging:
    needs: [image-config, publish-images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    permissions:
      contents: read
    env:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      STAGING_WORKDIR: ${{ vars.STAGING_WORKDIR }}
      STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
      STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
      STAGING_REGISTRY_USERNAME: ${{ secrets.STAGING_REGISTRY_USERNAME }}
      STAGING_REGISTRY_TOKEN: ${{ secrets.STAGING_REGISTRY_TOKEN }}
      STAGING_REGISTRY: ghcr.io
      STAGING_IMAGE_PREFIX: ${{ needs.image-config.outputs.namespace }}
      # Base Compose interpolation only; staging-images.json pins deployed images.
      STAGING_IMAGE_TAG: sha-${{ inputs.source_sha }}
      STAGING_SERVICES: ${{ join(fromJSON(inputs.services).include.*.service, ' ') }}
      STAGING_MIGRATION_SERVICES: ${{ inputs.migration_services }}
      STAGING_GATEWAY_HEALTH_PATHS: ${{ join(fromJSON(inputs.gateway_health_paths), ' ') }}
      STAGING_INFRASTRUCTURE_SERVICES: ${{ inputs.infrastructure_services }}
      STAGING_GATEWAY_SERVICE: ${{ inputs.gateway_service }}
    steps:
      - name: Check out tested deployment files
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}

      - name: Validate staging settings
        shell: bash
        run: |
          set -euo pipefail
          for variable_name in STAGING_HOST STAGING_USER STAGING_WORKDIR STAGING_KNOWN_HOSTS STAGING_SSH_PRIVATE_KEY STAGING_REGISTRY_USERNAME STAGING_REGISTRY_TOKEN; do
            if [[ -z "${!variable_name}" ]]; then
              echo "Missing required staging setting: ${variable_name}" >&2
              exit 1
            fi
          done

      # Retrieve the image digests from this workflow run, never registry tags.
      - uses: actions/download-artifact@v4
        with:
          pattern: release-image-*
          path: release-images
          merge-multiple: true

      - name: Assemble pinned images
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          images = {}
          for file in Path("release-images").glob("*.json"):
              images.update(json.loads(file.read_text())["services"])
          if not set(os.environ["STAGING_SERVICES"].split()).issubset(images):
              raise SystemExit("Missing release image artifacts")
          Path("staging-images.json").write_text(json.dumps({"services": images}))
          PY

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          key_file="$HOME/.ssh/id_ed25519"
          key_error=$(mktemp)
          trap 'rm -f "$key_error"' EXIT
          if ! LC_ALL=C ssh-keygen -y -P '' -f "$key_file" > /dev/null 2> "$key_error"; then
            if grep -Fq 'error in libcrypto' "$key_error"; then
              echo '::error::OpenSSH key validation failed: error in libcrypto. Root cause is not established.'
            elif grep -Fq 'incorrect passphrase' "$key_error"; then
              echo '::error::OpenSSH key validation failed: incorrect passphrase with an empty passphrase. This workflow has no passphrase support.'
            else
              echo '::error::OpenSSH key validation failed. Root cause is not established; key content was not modified.'
            fi
            exit 1
          else
            echo 'SSH private key is readable without a passphrase.'
          fi
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Upload deployment files
        shell: bash
        run: |
          set -euo pipefail
          target="${STAGING_USER}@${STAGING_HOST}"
          printf '%s\n' "$STAGING_WORKDIR" | ssh "$target" '
            IFS= read -r workdir
            mkdir -p -- "$workdir/infra/postgres" "$workdir/infra/nginx" "$workdir/infra/env" "$workdir/datasets" "$workdir/scripts"
          '
          scp docker-compose.staging.yml "$target:${STAGING_WORKDIR}/docker-compose.staging.yml"
          scp staging-images.json "$target:${STAGING_WORKDIR}/staging-images.json"
          scp .env.example "$target:${STAGING_WORKDIR}/.env.example"
          scp infra/env/*.env "$target:${STAGING_WORKDIR}/infra/env/"
          scp infra/postgres/start-postgres.sh "$target:${STAGING_WORKDIR}/infra/postgres/start-postgres.sh"
          scp infra/postgres/init-databases.sh "$target:${STAGING_WORKDIR}/infra/postgres/init-databases.sh"
          scp infra/nginx/nginx.conf "$target:${STAGING_WORKDIR}/infra/nginx/nginx.deployment.conf"
          scp scripts/deploy_staging.sh "$target:${STAGING_WORKDIR}/scripts/deploy_staging.sh"
          if [[ -d datasets ]]; then
            scp -r datasets/. "$target:${STAGING_WORKDIR}/datasets/"
          fi

      - name: Deploy tested release
        shell: bash
        run: |
          set -euo pipefail
          target="${STAGING_USER}@${STAGING_HOST}"
          {
            printf '%s\n' "$STAGING_WORKDIR"
            printf '%s\n' \
              "registry_token=$STAGING_REGISTRY_TOKEN" \
              "registry=$STAGING_REGISTRY" \
              "registry_user=$STAGING_REGISTRY_USERNAME" \
              "image_prefix=$STAGING_IMAGE_PREFIX" \
              "image_tag=$STAGING_IMAGE_TAG" \
              "service_names=$STAGING_SERVICES" \
              "migration_names=$STAGING_MIGRATION_SERVICES" \
              "gateway_names=$STAGING_GATEWAY_HEALTH_PATHS" \
              "infrastructure_names=$STAGING_INFRASTRUCTURE_SERVICES" \
              "gateway_service=$STAGING_GATEWAY_SERVICE"
          } | ssh "$target" 'IFS= read -r workdir; exec bash "$workdir/scripts/deploy_staging.sh" "$workdir"'
