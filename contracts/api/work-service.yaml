          type: string
        data:
          oneOf:
          - $ref: '#/components/schemas/Unlinked'
          - type: 'null'
        meta:
          type:
          - object
          - 'null'
          additionalProperties: {}
        error:
          oneOf:
          - $ref: '#/components/schemas/APIError'
          - type: 'null'
      required:
      - data
      - error
      - message
      - meta
      - success
    Version:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 0
      required:
      - expected_version
    WorkGitHubOperationReceipt:
      type: object
      additionalProperties: false
      required:
      - applied
      - project_id
      - operation_id
      - generation
      - status
      - repo_id
      - source_version
      properties:
        applied:
          type: boolean
          const: true
        project_id:
          type: string
          format: uuid
          not:
            const: 00000000-0000-0000-0000-000000000000
        operation_id:
          type: string
          minLength: 1
          maxLength: 100
          not:
            anyOf:
            - enum: ['.', '..']
            - pattern: '[\u0000-\u001f]'
        generation:
          type: integer
          minimum: 1
          description: >-
            Wire dùng token JSON integer không phần thập phân hoặc exponent
            (1, không phải 1.0/1e0); consumer không ép float sang int.
        status:
          type: string
          const: PENDING
        repo_id:
          type: [string, 'null']
          minLength: 1
          maxLength: 100
          pattern: '^[1-9][0-9]{0,99}$'
          not:
            type: string
            pattern: '[^0-9]'
          description: ID repository CONNECT là chuỗi số ASCII dương; DISCONNECT là null.
        source_version:
          type: integer
          minimum: 1
          description: >-
            Wire dùng token JSON integer không phần thập phân hoặc exponent
            (1, không phải 1.0/1e0); consumer không ép float sang int.
    WorkGitHubOperationReceiptEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/WorkGitHubOperationReceipt'
      description: >-
        Envelope Work; cho phép các metadata chuẩn message/meta/error ngoài
        success và data. data chỉ có đúng bảy trường receipt đã chốt.
    WorkErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: 'null'
          readOnly: true
        meta:
          type:
          - object
          - 'null'
          additionalProperties: {}
        error:
          $ref: '#/components/schemas/APIError'
      required:
      - data
      - error
      - message
      - meta
      - success
