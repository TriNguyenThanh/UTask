components:
  schemas:
    APIError:
      type: object
      properties:
        code:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
      required:
      - code
      - details
    ActionApply:
      type: object
      properties:
        proposal_id:
          type: string
          maxLength: 100
        item_id:
          type: string
          maxLength: 100
        ai_revision:
          type: string
          maxLength: 100
        context_version:
          type: integer
          minimum: 0
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ApprovedAction'
      required:
      - actions
      - ai_revision
      - context_version
      - item_id
      - proposal_id
    ActivitiesEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Activity'
        meta:
          oneOf:
          - $ref: '#/components/schemas/ListMeta'
          - type: 'null'
        error:
          oneOf:
          - $ref: '#/components/schemas/APIError'
          - type: 'null'
      required:
      - data
      - error
      - message
      - meta
      - success
    Activity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor_user_id:
          type:
          - string
          - 'null'
          format: uuid
        verb:
          type: string
          maxLength: 100
        field:
          type:
          - string
          - 'null'
          maxLength: 100
        old_value:
          type:
          - string
          - 'null'
        new_value:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - verb
    AppliedTask:
      type: object
      properties:
        id:
          type: string
          format: uuid
        local_id:
          type: string
        code:
          type: string
        version:
          type: integer
        ai_revision:
          type: string
        approved_payload_hash:
          type: string
      required:
      - ai_revision
      - approved_payload_hash
      - code
      - id
      - local_id
      - version
    ApplyResult:
      type: object
      properties:
        operation_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        parent_task_id:
          type:
          - string
          - 'null'
          format: uuid
        proposal_id:
          type: string
        source:
          type: string
        created_count:
          type: integer
        affected_tasks:
          type: array
          items:
            $ref: '#/components/schemas/AppliedTask'
        committed_at:
          type: string
          format: date-time
      required:
      - affected_tasks
      - committed_at
      - created_count
      - operation_id
      - parent_task_id
      - project_id
      - proposal_id
      - source
    ApplyResultEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          oneOf:
          - $ref: '#/components/schemas/ApplyResult'
          - type: 'null'
        meta:
          type:
          - object
          - 'null'
          additionalProperties: {}
        error:
