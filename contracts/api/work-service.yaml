          type: string
        data:
          oneOf:
          - $ref: '#/components/schemas/ExpandedTask'
          - type: 'null'
        meta:
          type:
          - object
          - 'null'
          additionalProperties: {}
        error:
          oneOf:
          - $ref: '#/components/schemas/APIError'
          - type: 'null'
      required:
      - data
      - error
      - message
      - meta
      - success
    TaskVersion:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
      required:
      - expected_version
    TeacherScopeEnum:
      enum:
