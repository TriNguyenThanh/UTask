        dự án có liên kết lớp và nhóm đã xác minh, hoặc công việc thuộc dự án đó.
        Bình luận Admin không được đánh dấu là phản hồi giảng viên và không cấp quyền
        đọc dự án/công việc hay danh sách bình luận. Giữ kiểm tra trạng thái và phạm
        vi người được nhắc tên.
