  /api/v1/internal/integration/projects/{project_id}/authorize:
    $ref: './work-ai-context-v1.yaml#/paths/~1api~1v1~1internal~1integration~1projects~1{project_id}~1authorize'
  /api/v1/internal/integration/projects/{project_id}/github/operations/{operation_id}:
    servers:
    - url: http://work-service:8000
    get:
      operationId: internal_integration_github_receipt
      summary: Đọc receipt Work đã chấp nhận operation GitHub
      x-implementation-status: planned
      x-utask-callers: [integration]
      description: >-
        Thiết kế mục tiêu; provider Work chưa triển khai. Chỉ caller integration,
        dùng X-Service-Key Integration→Work, không yêu cầu Bearer actor. Không nhận
        query hoặc body. Chỉ đọc receipt đã commit, không ghi dữ liệu hoặc confirm
        connection. JSON UTF-8 tối đa 65536 byte. project_id và operation_id trong
        receipt phải khớp path sau giải mã; operation_id là opaque ID, caller phải
        percent-encode khi đặt vào path, không ép thành UUID.
        Receipt là bằng chứng chấp nhận operation bất biến, giữ generation,
        source_version và repo_id của fact prepare đã commit. status luôn PENDING,
        kể cả khi connection đã CONNECTED/DISCONNECTED; không trả projection hiện
        thời. CONNECT có repo_id đích, DISCONNECT có repo_id null. Giữ receipt ít
        nhất 30 ngày và lâu hơn nếu còn đại diện binding đang dùng. Không có receipt
        đã commit khớp project/operation thì trả 404, không trả 200 với applied=false.
      parameters:
      - in: path
        name: project_id
        required: true
        schema:
          $ref: '#/components/schemas/WorkGitHubOperationReceipt/properties/project_id'
      - in: path
        name: operation_id
        required: true
        schema:
          $ref: '#/components/schemas/WorkGitHubOperationReceipt/properties/operation_id'
      security:
      - WorkServiceKey: []
      responses:
        '200':
          description: Receipt bất biến đã commit; Cache-Control no-store.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkGitHubOperationReceiptEnvelope'
              examples:
                connect:
                  summary: Work đã chấp nhận CONNECT, chưa suy ra trạng thái cuối
                  value:
                    success: true
                    data:
                      applied: true
                      project_id: 11111111-1111-4111-8111-111111111111
                      operation_id: connect:project:1
                      generation: 1
                      status: PENDING
                      repo_id: '12345'
                      source_version: 2
                disconnect:
                  summary: Work đã chấp nhận DISCONNECT
                  value:
                    success: true
                    data:
                      applied: true
                      project_id: 11111111-1111-4111-8111-111111111111
                      operation_id: disconnect:project:2
                      generation: 2
                      status: PENDING
                      repo_id: null
                      source_version: 4
        '400':
          description: Path không hợp lệ hoặc request có query/body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkErrorEnvelope'
        '403':
          description: Service key thiếu, sai hoặc không thuộc caller integration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkErrorEnvelope'
        '404':
          description: Không có receipt đã commit khớp project và operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkErrorEnvelope'
        '503':
          description: Tạm thời không đọc được receipt; không fallback cho phép.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkErrorEnvelope'
  /comments/:
    post:
