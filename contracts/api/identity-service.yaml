  /admin/users:
    get:
      operationId: admin_users_list
      parameters:
      - in: query
        name: deleted
        schema:
          enum:
          - active
          - deleted
          - all
          type: string
          default: active
          minLength: 1
        description: |-
          * `active` - active
          * `deleted` - deleted
          * `all` - all
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: role
        schema:
          enum:
          - SYSTEM_ADMIN
          - TEACHER
          - STUDENT
          type: string
          minLength: 1
        description: |-
          * `SYSTEM_ADMIN` - System administrator
          * `TEACHER` - Teacher
          * `STUDENT` - Student
      - in: query
        name: search
        schema:
          type: string
          maxLength: 255
      - in: query
        name: status
        schema:
          enum:
          - PENDING_ACTIVATION
