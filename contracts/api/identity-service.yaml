components:
  schemas:
    APIError:
      type: object
      description: Shared error payload, preserving existing detail objects and array
        semantics.
      properties:
        code:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - code
      - details
    AccountStatusEnum:
      enum:
      - PENDING_ACTIVATION
      - ACTIVE
      - SUSPENDED
      type: string
      description: |-
        * `PENDING_ACTIVATION` - Pending activation
        * `ACTIVE` - Active
        * `SUSPENDED` - Suspended
    ActivationInputRequest:
      type: object
      properties:
        key:
          type: string
          minLength: 1
        new_password1:
          type: string
          minLength: 1
        new_password2:
          type: string
          minLength: 1
      required:
      - key
    AdminAuditLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor_id:
          type: string
          readOnly: true
          nullable: true
        action:
          type: string
          readOnly: true
        target_user_id:
          type: string
          readOnly: true
          nullable: true
        ip_address:
          type: string
          readOnly: true
        user_agent:
          type: string
          readOnly: true
        details:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor_id
      - created_at
      - details
      - id
      - ip_address
      - target_user_id
      - user_agent
    AdminCreateUserRequest:
      type: object
      description: Reject unknown input fields rather than silently dropping privileged
        data.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 255
        username:
          type: string
          nullable: true
          maxLength: 100
        first_name:
          type: string
          default: ''
          maxLength: 100
        last_name:
          type: string
          default: ''
          maxLength: 100
        student_id:
          type: string
          nullable: true
          maxLength: 50
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleCodeEnum'
          default:
          - STUDENT
          maxItems: 3
          minItems: 1
        password:
          type: string
          writeOnly: true
          nullable: true
          minLength: 1
          maxLength: 128
        send_activation_email:
          type: boolean
          default: false
      required:
      - email
    AdminRevokeAllSessionsData:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        revoked_sessions_count:
          type: integer
      required:
      - revoked_sessions_count
      - user_id
    AdminRevokeSessionData:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        revoked:
          type: boolean
      required:
      - revoked
