openapi: 3.1.0
info:
  title: UTask AI Service API
  version: 1.0.0
  description: |
    Hợp đồng API mục tiêu cho AI Service giai đoạn 1. Hợp đồng đã chốt thiết kế
    với API, PostgreSQL, Redis/Celery và ADK runtime; integration domain cần cấu hình.
  x-utask-status: partially-implemented
  x-utask-owner: ai-service
servers:
  - url: /
    description: Gateway base URL
tags:
  - name: AI requests
    description: Tạo và theo dõi yêu cầu phân tích/đề xuất của AI.
paths:
  /api/ai/v1/requests:
    post:
      tags: [AI requests]
      summary: Tạo yêu cầu AI
      operationId: createAiRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAiRequest'
      responses:
        '200':
          description: Workflow hoàn tất trong thời gian xử lý đồng bộ.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SucceededAiResponse'
        '202':
          description: Đã nhận request và chuyển sang xử lý bất đồng bộ.
          headers:
            Location:
              schema:
                type: string
                format: uri-reference
              description: URL truy vấn trạng thái request.
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedAiResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/TargetAccessDenied'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/ProviderUnavailable'
        '504':
          $ref: '#/components/responses/WorkflowTimeout'
  /api/ai/v1/requests/{request_id}:
    get:
      tags: [AI requests]
      summary: Xem trạng thái và kết quả yêu cầu AI
      operationId: getAiRequest
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: request_id
          in: path
          required: true
          description: ID của yêu cầu AI.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trạng thái hiện tại của request.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAiResponse'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '404':
          $ref: '#/components/responses/RequestNotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Gateway xác thực token và truyền identity đã xác minh vào request context.

  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: ID trace do client cung cấp; server tạo mới nếu bị bỏ qua.
      schema:
        type: string
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Khóa chống xử lý trùng. Cùng khóa phải đi kèm cùng payload và cùng user.
      schema:
        type: string
        minLength: 1
        maxLength: 256

  headers:
    RequestId:
      description: ID trace của request.
      schema:
        type: string
        maxLength: 128

  responses:
    InvalidRequest:
      description: Request hoặc JSON không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthenticationRequired:
      description: Không có identity hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TargetAccessDenied:
      description: User không có quyền yêu cầu phân tích target.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    IdempotencyConflict:
      description: Idempotency key đã được dùng với payload khác.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidInput:
      description: Input hợp lệ về JSON nhưng không hợp lệ theo intent.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Vượt rate limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProviderUnavailable:
      description: Provider không sẵn sàng hoặc workflow hết thời gian đồng bộ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    WorkflowTimeout:
      description: Workflow vượt hard timeout.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RequestNotFound:
      description: Không tìm thấy request thuộc user hiện tại.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Intent:
      type: string
      enum:
        - backlog_generation
        - task_decomposition
        - risk_analysis

    Target:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: string
          enum: [project, task, sprint]
        id:
          type: string
          format: uuid

    CreateAiRequest:
      oneOf:
        - $ref: '#/components/schemas/BacklogGenerationRequest'
        - $ref: '#/components/schemas/TaskDecompositionRequest'
        - $ref: '#/components/schemas/RiskAnalysisRequest'
      discriminator:
        propertyName: intent
        mapping:
          backlog_generation: '#/components/schemas/BacklogGenerationRequest'
          task_decomposition: '#/components/schemas/TaskDecompositionRequest'
          risk_analysis: '#/components/schemas/RiskAnalysisRequest'

    RequestCommon:
      type: object
      required: [intent, input]
      properties:
        intent:
          $ref: '#/components/schemas/Intent'
        input:
          type: object
        output_schema_version:
          type: string
          default: current
          description: Chỉ nhận phiên bản được service hỗ trợ.

    BacklogGenerationRequest:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/RequestCommon'
        - type: object
          properties:
            intent:
              const: backlog_generation
            target:
              $ref: '#/components/schemas/ProjectTarget'
            input:
              $ref: '#/components/schemas/BacklogInput'
          required: [intent, input]

    TaskDecompositionRequest:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/RequestCommon'
        - type: object
          properties:
            intent:
              const: task_decomposition
            target:
              $ref: '#/components/schemas/TaskTarget'
            input:
              $ref: '#/components/schemas/TaskDecompositionInput'
          required: [intent, target, input]

    RiskAnalysisRequest:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/RequestCommon'
        - type: object
          properties:
            intent:
              const: risk_analysis
            target:
              $ref: '#/components/schemas/RiskTarget'
            input:
              $ref: '#/components/schemas/RiskAnalysisInput'
          required: [intent, target, input]

    ProjectTarget:
      allOf:
        - $ref: '#/components/schemas/Target'
        - type: object
          properties:
            type:
              const: project

    TaskTarget:
      allOf:
        - $ref: '#/components/schemas/Target'
        - type: object
          properties:
            type:
              const: task

    RiskTarget:
      oneOf:
        - $ref: '#/components/schemas/ProjectTarget'
        - $ref: '#/components/schemas/SprintTarget'

    SprintTarget:
      allOf:
        - $ref: '#/components/schemas/Target'
        - type: object
          properties:
            type:
              const: sprint

    BacklogInput:
      type: object
      additionalProperties: false
      required: [description]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 12000
        goals:
          type: array
          maxItems: 30
          items:
            type: string
            minLength: 1
            maxLength: 1000
        tech_stack:
          type: array
          maxItems: 30
          items:
            type: string
            minLength: 1
            maxLength: 200
        deadline:
          type: string
          format: date-time
        constraints:
          type: array
          maxItems: 30
          items:
            type: string
            minLength: 1
            maxLength: 1000
        additional_instruction:
          type: string
          maxLength: 4000

    TaskDecompositionInput:
      type: object
      additionalProperties: false
      properties:
        task_description:
          type: string
          minLength: 1
          maxLength: 12000
        acceptance_criteria:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 1000
        dependencies:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 500
        additional_instruction:
          type: string
          maxLength: 4000

    RiskAnalysisInput:
      type: object
      additionalProperties: false
      properties:
        analysis_window:
          type: object
          additionalProperties: false
          required: [from, to]
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
        focus:
          type: array
          maxItems: 10
          items:
            type: string
            enum: [deadline, blocked_task, github_activity, progress]

    AiStatus:
      type: string
      enum: [queued, running, succeeded, failed]

    ContextSource:
      type: object
      additionalProperties: false
      required: [domain, status]
      properties:
        domain:
          type: string
          enum: [project, task, sprint, progress, github_activity, team]
        status:
          type: string
          enum: [available, stale, missing, partial, unavailable]
        as_of:
          type: string
          format: date-time
        source_version:
          type: string
        warning:
          type: string

    ContextMetadata:
      type: object
      additionalProperties: false
      required: [as_of, sources, fingerprint]
      properties:
        as_of:
          type: string
          format: date-time
        sources:
          type: array
          items:
            $ref: '#/components/schemas/ContextSource'
        fingerprint:
          type: string
          minLength: 1
          maxLength: 256

    BacklogItem:
      type: object
      additionalProperties: false
      required: [type, title, description, priority, estimate_points, dependencies, acceptance_criteria, rationale]
      properties:
        type:
          type: string
          enum: [task]
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [low, medium, high, critical]
        estimate_points:
          type: number
          minimum: 0
        dependencies:
          type: array
          items:
            type: string
        acceptance_criteria:
          type: array
          items:
            type: string
        rationale:
          type: string

    BacklogResult:
      type: object
      additionalProperties: false
      required: [items, warnings]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/BacklogItem'
        warnings:
          type: array
          items:
            type: string

    Subtask:
      type: object
      additionalProperties: false
      required: [title, description, acceptance_criteria, dependencies, estimate_points]
      properties:
        title:
          type: string
        description:
          type: string
        acceptance_criteria:
          type: array
          items:
            type: string
        dependencies:
          type: array
          items:
            type: string
        estimate_points:
          type: number
          minimum: 0

    TaskDecompositionResult:
      type: object
      additionalProperties: false
      required: [subtasks, warnings]
      properties:
        subtasks:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Subtask'
        warnings:
          type: array
          items:
            type: string

    RiskEvidence:
      type: object
      additionalProperties: false
      required: [source_type, source_id, observed_at]
      properties:
        source_type:
          type: string
          enum: [progress_metric, task, sprint, github_activity]
        source_id:
          type: string
        observed_at:
          type: string
          format: date-time

    Risk:
      type: object
      additionalProperties: false
      required: [code, level, title, reason, evidence, suggested_actions]
      properties:
        code:
          type: string
        level:
          type: string
          enum: [low, medium, high, critical]
        title:
          type: string
        reason:
          type: string
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/RiskEvidence'
        suggested_actions:
          type: array
          items:
            type: string

    RiskAnalysisResult:
      type: object
      additionalProperties: false
      required: [overall_level, risks, limitations]
      properties:
        overall_level:
          type: string
          enum: [none, low, medium, high, critical, unknown]
        risks:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Risk'
        limitations:
          type: array
          items:
            type: string

    AiResult:
      oneOf:
        - $ref: '#/components/schemas/BacklogResult'
        - $ref: '#/components/schemas/TaskDecompositionResult'
        - $ref: '#/components/schemas/RiskAnalysisResult'

    AiResponseBase:
      type: object
      required: [request_id, intent, status, output_schema_version, created_at]
      properties:
        request_id:
          type: string
          format: uuid
        intent:
          $ref: '#/components/schemas/Intent'
        status:
          $ref: '#/components/schemas/AiStatus'
        output_schema_version:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SucceededAiResponse:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/AiResponseBase'
        - type: object
          required: [status, result, context, completed_at]
          properties:
            status:
              const: succeeded
            result:
              $ref: '#/components/schemas/AiResult'
            context:
              $ref: '#/components/schemas/ContextMetadata'
            completed_at:
              type: string
              format: date-time

    QueuedAiResponse:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/AiResponseBase'
        - type: object
          required: [status, status_url]
          properties:
            status:
              const: queued
            status_url:
              type: string
              format: uri-reference

    GetAiResponse:
      oneOf:
        - $ref: '#/components/schemas/SucceededAiResponse'
        - $ref: '#/components/schemas/QueuedAiResponse'
        - $ref: '#/components/schemas/RunningAiResponse'
        - $ref: '#/components/schemas/FailedAiResponse'

    RunningAiResponse:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/AiResponseBase'
        - type: object
          required: [status]
          properties:
            status:
              const: running
            context:
              $ref: '#/components/schemas/ContextMetadata'

    FailedAiResponse:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/AiResponseBase'
        - type: object
          required: [status, error]
          properties:
            status:
              const: failed
            error:
              $ref: '#/components/schemas/Error'

    Error:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - INVALID_INTENT
            - INVALID_INPUT
            - AUTHENTICATION_REQUIRED
            - TARGET_ACCESS_DENIED
            - REQUEST_NOT_FOUND
            - IDEMPOTENCY_CONFLICT
            - OUTPUT_VALIDATION_FAILED
            - RATE_LIMITED
            - INTERNAL_ERROR
            - PROVIDER_UNAVAILABLE
            - WORKFLOW_TIMEOUT
        message:
          type: string
        details:
          type: object
        request_id:
          type: string
          format: uuid
        retryable:
          type: boolean

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'

x-utask-runtime:
  sync_timeout_seconds: 10
  workflow_timeout_seconds: 30
  long_request_behavior: |
    Nếu workflow không hoàn tất trong 10 giây, POST trả 202 với trạng thái queued
    và client truy vấn lại bằng GET. Nếu workflow vượt hard timeout 30 giây,
    request chuyển failed với WORKFLOW_TIMEOUT. Kafka không dùng cho
    request-response của client.
  bounded_agent_budget:
    max_model_calls: 4
    max_context_tool_calls: 5
    max_specialist_calls: 1
    max_output_tokens: 4000
  proposal_boundary: |
    Kết quả AI chỉ là proposal. AI Service không có endpoint apply; service sở
    hữu dữ liệu phải kiểm tra quyền và business rule trước khi áp dụng.
