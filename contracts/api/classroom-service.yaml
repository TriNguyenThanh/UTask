openapi: 3.1.0
info:
  title: UTask Classroom API
  version: '1.4'
paths:
  /classes/:
    get:
      operationId: classes_list
      parameters:
      - in: query
        name: course_id
        schema:
          type: string
        description: Lọc theo UUID môn học.
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: grouping_phase
        schema:
          type: string
          enum:
          - FORMING
          - LOCKED
        description: Lọc theo giai đoạn chia nhóm.
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Tìm theo mã/tên lớp, học kỳ hoặc môn học.
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: term
        schema:
          type: string
        description: Lọc theo học kỳ.
      tags:
      - classes
      security:
      - ClassroomBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
    post:
      operationId: classes_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      tags:
      - classes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassInput'
        required: true
      security:
      - ClassroomBearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassCreated'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
