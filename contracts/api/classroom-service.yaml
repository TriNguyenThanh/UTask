components:
  schemas:
    APIError:
      type: object
      properties:
        code:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
      required:
      - code
      - details
    AccessCode:
      type: object
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
        code:
          type: string
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        enabled:
          type: boolean
      required:
      - enabled
      - expires_at
      - id
      - version
    Activity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        class_section_id:
          type: string
          format: uuid
          readOnly: true
        actor_user_id:
          type:
          - string
          - 'null'
          format: uuid
        verb:
          type: string
          maxLength: 100
        subject_type:
          type: string
          maxLength: 100
        subject_id:
          type: string
          format: uuid
        changes:
          allOf:
          - $ref: '#/components/schemas/ActivityChanges'
          readOnly: true
        created_at:
          type: string
          format: date-time
      required:
      - changes
      - class_section_id
      - id
      - subject_id
      - subject_type
      - verb
    ActivityChanges:
      type: object
      properties:
        old:
          oneOf:
          - {}
          - type: 'null'
        new:
          oneOf:
          - {}
          - type: 'null'
    AdjustmentResult:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        group_id:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - group_id
      - user_id
    Class:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        course_summary:
          allOf:
          - $ref: '#/components/schemas/CourseSummary'
          readOnly: true
        enrolled_count:
          type: integer
          minimum: 0
          readOnly: true
        active_group_count:
          type: integer
          minimum: 0
          readOnly: true
        primary_teacher_id:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
        my_group_id:
          type:
          - string
          - 'null'
          format: uuid
          readOnly: true
        my_group_name:
          type:
          - string
          - 'null'
          readOnly: true
        code:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 200
        term:
          type: string
          maxLength: 100
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        status:
          type: string
          maxLength: 20
        grouping_phase:
          type: string
          maxLength: 20
        grouping_locked_at:
          type:
          - string
          - 'null'
          format: date-time
        formation_deadline:
          type:
          - string
          - 'null'
          format: date-time
        group_min_size:
          type: integer
          maximum: 2147483647
          minimum: 0
        group_max_size:
          type: integer
          maximum: 2147483647
          minimum: 0
        join_code_expires_at:
          type:
          - string
          - 'null'
          format: date-time
        version:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        event_sequence:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          readOnly: true
        course:
          type: string
          format: uuid
      required:
      - active_group_count
      - code
      - course
      - course_summary
      - ends_on
      - enrolled_count
      - id
      - my_group_id
      - my_group_name
      - name
      - primary_teacher_id
      - starts_on
      - term
      - updated_at
    ClassActivityViewResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Activity'
        meta:
          oneOf:
          - $ref: '#/components/schemas/ListMeta'
          - type: 'null'
        error:
          oneOf:
          - $ref: '#/components/schemas/APIError'
          - type: 'null'
      required:
      - data
      - error
      - message
      - meta
      - success
    ClassCodeViewResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          oneOf:
          - $ref: '#/components/schemas/AccessCode'
