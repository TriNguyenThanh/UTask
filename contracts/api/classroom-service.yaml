          type: array
          items:
            type: object
            additionalProperties: {}
          maxItems: 100
          minItems: 1
        reactivate_inactive:
          type: boolean
      required:
      - students
    StudentListResult:
      type: object
      properties:
        summary:
          $ref: '#/components/schemas/EnrollmentSummary'
        results:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - results
      - summary
    StudentListViewResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          oneOf:
          - $ref: '#/components/schemas/StudentListResult'
          - type: 'null'
        meta:
          type:
          - object
          - 'null'
          additionalProperties: {}
        error:
          oneOf:
          - $ref: '#/components/schemas/APIError'
          - type: 'null'
      required:
      - data
      - error
      - message
      - meta
      - success
    Teacher:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user_id:
          type: string
          format: uuid
        role:
          type: string
          maxLength: 20
        status:
          type: string
          maxLength: 20
        assigned_at:
          type: string
          format: date-time
        left_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - user_id
    TeacherAdjustment:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        target_group_id:
          type:
          - string
          - 'null'
          format: uuid
        successor_user_id:
          type: string
          format: uuid
        dissolve_if_sole_member:
          type: boolean
        reason:
          type: string
          maxLength: 500
          minLength: 1
      required:
      - reason
      - target_group_id
      - user_id
    TeacherAdjustmentViewResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          oneOf:
          - $ref: '#/components/schemas/AdjustmentResult'
          - type: 'null'
        meta:
          type:
          - object
          - 'null'
          additionalProperties: {}
        error:
          oneOf:
          - $ref: '#/components/schemas/APIError'
          - type: 'null'
      required:
      - data
      - error
      - message
      - meta
      - success
    TeacherGroups:
      type: object
      properties:
        group_ids:
          type: array
          items:
            type: string
            format: uuid
      required:
      - group_ids
    TeacherGroupsEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          oneOf:
          - $ref: '#/components/schemas/TeacherGroups'
          - type: 'null'
        meta:
          type:
          - object
          - 'null'
          additionalProperties: {}
        error:
          oneOf:
          - $ref: '#/components/schemas/APIError'
          - type: 'null'
      required:
      - data
      - error
      - message
      - meta
      - success
    TeacherInput:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
        user_id:
          type: string
          format: uuid
        role:
          allOf:
          - $ref: '#/components/schemas/TeacherRoleEnum'
          default: CO_TEACHER
        status:
          allOf:
          - $ref: '#/components/schemas/TeacherStatusEnum'
          default: ACTIVE
      required:
      - user_id
      - version
    TeacherRoleEnum:
      enum:
      - PRIMARY
      - CO_TEACHER
      type: string
      description: |-
        * `PRIMARY` - PRIMARY
        * `CO_TEACHER` - CO_TEACHER
    TeacherStatusEnum:
      enum:
      - ACTIVE
      - LEFT
      type: string
      description: |-
        * `ACTIVE` - ACTIVE
        * `LEFT` - LEFT
  securitySchemes:
    ClassroomBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: /api/classroom
  description: Classroom API qua gateway
