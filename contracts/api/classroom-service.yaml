  /classes/{class_id}/enrollments/:
    get:
      operationId: classes_enrollments_retrieve
      description: Giảng viên phụ trách hoặc Quản trị viên hệ thống xem danh sách
        ghi danh của lớp. Để tìm theo tên, email hoặc MSSV, tra cứu trước qua GET
        /api/auth/users/search rồi lọc bằng tham số user_id.
      parameters:
      - in: path
        name: class_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: has_group
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: Lọc sinh viên đã có nhóm hoạt động hay chưa.
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: user_id
        schema:
          type: string
        description: Lọc theo UUID người dùng.
      tags:
      - classes
      security:
