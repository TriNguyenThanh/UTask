  /classes/{class_id}/enrollments/{enrollment_id}/exit/:
    post:
      operationId: classes_enrollments_exit_create
      description: Sinh viên tự rời lớp theo điều kiện hiện tại; Teacher đang phụ
        trách hoặc Admin được loại sinh viên. Nếu là trưởng nhóm và còn thành viên
        khác thì cần chuyển quyền trước; nếu là thành viên duy nhất của nhóm thì cần
        gửi dissolve_if_sole_member=true để giải thể nhóm.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      - in: path
        name: class_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
