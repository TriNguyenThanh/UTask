  /classes/{class_id}/lock-grouping/:
    post:
      operationId: classes_lock_grouping_create
      description: Teacher có global role TEACHER và phân công ACTIVE, hoặc Admin,
        được chốt nhóm; PRIMARY và CO_TEACHER có quyền ngang nhau. Mặc định kiểm tra
        sinh viên chưa có nhóm và nhóm chưa đủ group_min_size (409 GROUPING_PRECONDITIONS_UNMET)
        trừ khi force=true.
      parameters:
      - in: header
