openapi: 3.1.0
info:
  title: UTask Classroom API
  version: '1.4'
paths:
  /courses/:
    get:
      operationId: courses_retrieve
      tags:
      - courses
      security:
      - ClassroomBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
    post:
      operationId: courses_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      tags:
      - courses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseInput'
        required: true
      security:
      - ClassroomBearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseCreated'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
  /courses/{course_id}/:
    patch:
      operationId: courses_partial_update
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      - in: path
        name: course_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - courses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCourseInput'
      security:
      - ClassroomBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseUpdateViewResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
  /courses/{course_id}/archive/:
    post:
      operationId: courses_archive_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        required: true
      - in: path
        name: course_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - courses
      security:
      - ClassroomBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseArchiveViewResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassroomErrorEnvelope'
          description: ''
components:
  schemas:
    APIError:
      type: object
      properties:
        code:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
      required:
      - code
      - details
    ClassroomErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: 'null'
          readOnly: true
        meta:
          type:
          - object
          - 'null'
          additionalProperties: {}
        error:
          $ref: '#/components/schemas/APIError'
      required:
      - data
      - error
      - message
      - meta
      - success
    Course:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 200
        archived_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - code
      - id
      - name
    CourseArchiveViewResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          oneOf:
          - $ref: '#/components/schemas/Course'
          - type: 'null'
        meta:
          type:
          - object
          - 'null'
          additionalProperties: {}
        error:
          oneOf:
          - $ref: '#/components/schemas/APIError'
          - type: 'null'
      required:
      - data
      - error
      - message
      - meta
      - success
    CourseCreated:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          oneOf:
          - $ref: '#/components/schemas/Course'
          - type: 'null'
        meta:
          type:
          - object
          - 'null'
          additionalProperties: {}
        error:
          oneOf:
          - $ref: '#/components/schemas/APIError'
          - type: 'null'
      required:
      - data
      - error
      - message
      - meta
      - success
    CourseInput:
      type: object
      properties:
        code:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 200
      required:
      - code
      - name
    CourseList:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Course'
        meta:
          type:
          - object
          - 'null'
          additionalProperties: {}
        error:
          oneOf:
          - $ref: '#/components/schemas/APIError'
          - type: 'null'
      required:
      - data
      - error
      - message
      - meta
      - success
    CourseUpdateViewResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          oneOf:
          - $ref: '#/components/schemas/Course'
          - type: 'null'
        meta:
          type:
          - object
          - 'null'
          additionalProperties: {}
        error:
          oneOf:
          - $ref: '#/components/schemas/APIError'
          - type: 'null'
      required:
      - data
      - error
      - message
      - meta
      - success
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
        issue:
          type: string
      required:
      - issue
    PatchedCourseInput:
      type: object
      properties:
        code:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 200
  securitySchemes:
    ClassroomBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: /api/classroom
  description: Classroom API qua gateway
