# Core Modular Monolith (Identity, Classroom, Work) on single-VPS staging:
# 1 pinned image, 3 runtime containers (API, worker with embedded Beat `-B` + heartbeat, integration consumer).
# Split standalone Beat singleton before scaling core-worker > 1 replica in production.
x-logging: &default_logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-core-runtime: &core_runtime
  <<: *default_logging
  image: ${UTASK_IMAGE_PREFIX:?Set staging image prefix}/core-service:${UTASK_IMAGE_TAG:?Set release SHA tag}
  init: true
  restart: unless-stopped
  env_file:
    - ./infra/env/database.env
    - ./infra/env/django.env
    - ./infra/env/core-service.env
  volumes:
    - type: bind
      source: ${IDENTITY_JWT_PRIVATE_KEY_HOST_PATH:?Set the RSA private key path on the staging server}
      target: /run/identity-secrets/jwt-private.pem
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./infra/env
      target: /run/kafka-certificates
      read_only: true
  depends_on: &core_dependencies
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  core-service:
    <<: *core_runtime
    x-deploy:
      gateway_health_paths:
        - /api/auth/healthz
        - /api/classroom/healthz
        - /api/work/healthz
    x-ci:
      test_env:
        CORE_TEST_DB_NAME: ci
        CORE_TEST_DATABASE: test_core_ci
        CORE_TEST_DB_USER: utask_ci
        CORE_TEST_DB_PASSWORD: ci-only-postgres-password
        CORE_TEST_DB_HOST: "127.0.0.1"
        CORE_TEST_DB_PORT: "5432"
        CORE_REDIS_URL: redis://127.0.0.1:6379/15
    networks:
      default:
        aliases:
          - identity-service
          - classroom-service
          - work-service
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  core-worker:
    <<: *core_runtime
    profiles: [core-service]
    x-deploy: &core_worker
      role: worker
      application: core-service
    command: ["celery", "-A", "config", "worker", "-B", "-Q", "core-worker", "--concurrency=1", "--schedule=/tmp/core-celerybeat"]
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      <<: *core_dependencies
      core-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; assert (time.time() - float(Path('/tmp/core-worker.heartbeat').read_text())) < 30"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  core-consumer:
    <<: *core_runtime
    profiles: [core-service]
    x-deploy: *core_worker
    stop_grace_period: 15s
    command: ["python", "manage.py", "consume_integration"]
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      <<: *core_dependencies
      core-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert any(p.read_bytes().split(b'\\0')[1:3] == [b'manage.py', b'consume_integration'] for p in Path('/proc').glob('[0-9]*/cmdline'))"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s
