# AI Service on single-VPS staging: 1 pinned image, 3 runtime containers.
# scripts/deploy_staging.sh runs `alembic upgrade head` before rollout.
# Worker embeds Beat (`-B`) for single-replica staging; split standalone Beat
# before scaling ai-worker > 1 replica in production.
x-logging: &default_logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-ai-runtime: &ai_runtime
  <<: *default_logging
  profiles: [ai-service]
  image: ${UTASK_IMAGE_PREFIX:?Set staging image prefix}/ai-service:${UTASK_IMAGE_TAG:?Set release SHA tag}
  init: true
  restart: unless-stopped
  env_file:
    - ./infra/env/ai-service.env
  environment:
    AI_ENVIRONMENT: ${AI_ENVIRONMENT:-staging}
    MOCK_TEST: ${MOCK_TEST:-false}
    AI_DATABASE_URL: ${AI_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${AI_DB_NAME:-ai_context_db}}
    AI_BROKER_URL: ${AI_BROKER_URL:-redis://redis:6379/1}
    AI_JWT_ISSUER: ${AI_JWT_ISSUER:-${IDENTITY_JWT_ISSUER:-https://identity.utask.internal}}
    AI_JWT_AUDIENCE: ${AI_JWT_AUDIENCE:-${IDENTITY_JWT_AUDIENCE:-utask-platform}}
    AI_JWT_ALGORITHM: ${AI_JWT_ALGORITHM:-RS256}
    AI_IDENTITY_BASE_URL: ${AI_IDENTITY_BASE_URL:-http://identity-service:8000}
    AI_IDENTITY_SERVICE_KEY: ${AI_IDENTITY_SERVICE_KEY:-}
    AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-litellm}
    AI_MODEL: ${AI_MODEL:-}
    AI_LLM_API_KEY: ${AI_LLM_API_KEY:-}
    AI_WORK_SERVICE_AUTH_ENABLED: ${AI_WORK_SERVICE_AUTH_ENABLED:-false}
    AI_WORK_SERVICE_KEY: ${AI_WORK_SERVICE_KEY:-}
    AI_INTEGRATION_SERVICE_KEY: ${AI_INTEGRATION_SERVICE_KEY:-}
    AI_LLM_API_BASE: ${AI_LLM_API_BASE:-}
  volumes:
    - ./datasets:/app/datasets:ro
  depends_on: &ai_dependencies
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  ai-service:
    <<: *ai_runtime
    x-deploy:
      gateway_health_path: null
    x-ci:
      test_env:
        TEST_DATABASE_NAME: ai_test
        TEST_DATABASE_URL: postgresql+psycopg://utask_ci:ci-only-postgres-password@127.0.0.1:5432/ai_test
        TEST_REDIS_URL: redis://127.0.0.1:6379/15
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  ai-worker:
    <<: *ai_runtime
    x-deploy: &ai_worker
      role: worker
      application: ai-service
    command: ["celery", "-A", "jobs.celery_app:celery_app", "worker", "-B", "--loglevel=INFO", "--concurrency=${AI_WORKER_CONCURRENCY:-2}", "--schedule=/tmp/ai-beat-schedule"]
    deploy:
      resources:
        limits:
          memory: 1024M
    depends_on:
      <<: *ai_dependencies
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A jobs.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout=5"]
      interval: 45s
      timeout: 10s
      retries: 4
      start_period: 20s

  ai-dispatcher:
    <<: *ai_runtime
    x-deploy: *ai_worker
    command: ["python", "-m", "jobs.dispatcher"]
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      <<: *ai_dependencies
      ai-service:
        condition: service_healthy
    # Process liveness only; delivery readiness requires an end-to-end check.
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert any(p.read_bytes().split(b'\\0')[1:3] == [b'-m', b'jobs.dispatcher'] for p in Path('/proc').glob('[0-9]*/cmdline'))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
