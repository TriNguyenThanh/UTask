# Shared local infrastructure: PostgreSQL 16, Redis 7, optional Kafka KRaft, and Nginx gateway.
x-logging: &default_logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *default_logging
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:55432:5432"
    env_file:
      - ./infra/env/database.env
      - ./infra/env/postgres.env
    entrypoint: ["/bin/sh", "/usr/local/bin/start-postgres.sh"]
    command: ["postgres"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/start-postgres.sh:/usr/local/bin/start-postgres.sh:ro
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/utask-postgres-ready && pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 150s

  redis:
    <<: *default_logging
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    <<: *default_logging
    profiles: [kafka]
    image: apache/kafka:3.9.0
    restart: unless-stopped
    env_file:
      - ./infra/env/kafka.env
      - ./infra/env/kafka-startup.env
    command: ["/bin/sh", "/opt/kafka/start-kafka.sh"]
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./infra/kafka/start-kafka.sh:/opt/kafka/start-kafka.sh:ro
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/utask-kafka-ready && /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 120s

  nginx:
    <<: *default_logging
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${UTASK_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      core-service:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  kafka_data:
