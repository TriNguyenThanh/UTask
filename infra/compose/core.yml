# Core Modular Monolith (Identity, Classroom, Work): 1 image built once, 2 default containers + 1 optional integration consumer.
x-logging: &default_logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-core-runtime: &core_runtime
  <<: *default_logging
  image: ${UTASK_IMAGE_PREFIX:-utask}/core-service:${UTASK_IMAGE_TAG:-local}
  init: true
  restart: unless-stopped
  env_file:
    - ./infra/env/database.env
    - ./infra/env/django.env
    - ./infra/env/core-service.env
  volumes:
    - type: bind
      source: ${IDENTITY_JWT_PRIVATE_KEY_HOST_PATH:-./.local-secrets/identity-jwt-private.pem}
      target: /run/identity-secrets/jwt-private.pem
      read_only: true
    - type: bind
      source: ./infra/env
      target: /run/kafka-certificates
      read_only: true

services:
  core-service:
    <<: *core_runtime
    build: ./apps/core-service
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      default:
        aliases:
          - identity-service
          - classroom-service
          - work-service
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  core-worker:
    <<: *core_runtime
    command: ["celery", "-A", "config", "worker", "-B", "-Q", "core-worker", "--concurrency=1", "--schedule=/tmp/core-celerybeat"]
    deploy:
      resources:
        limits:
          memory: 384M
    depends_on:
      core-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; assert (time.time() - float(Path('/tmp/core-worker.heartbeat').read_text())) < 30"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  core-consumer:
    <<: *core_runtime
    profiles: [integration-service]
    stop_grace_period: 15s
    command: ["python", "manage.py", "consume_integration"]
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      core-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert any(p.read_bytes().split(b'\\0')[1:3] == [b'manage.py', b'consume_integration'] for p in Path('/proc').glob('[0-9]*/cmdline'))"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s
