# AI Service (local dev): 1 image built once, 3 containers (API migrates via entrypoint; worker embeds Beat `-B`; dispatcher).
x-logging: &default_logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-ai: &ai
  <<: *default_logging
  profiles: [ai-service]
  image: ${UTASK_IMAGE_PREFIX:-utask}/ai-service:${UTASK_IMAGE_TAG:-local}
  restart: unless-stopped
  init: true
  env_file:
    - ./infra/env/ai-service.env
  volumes:
    - ./datasets:/app/datasets:ro
  extra_hosts:
    - host.docker.internal:host-gateway

services:
  ai-service:
    <<: *ai
    build: ./apps/ai-service
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  ai-worker:
    <<: *ai
    command: [celery, -A, "jobs.celery_app:celery_app", worker, -B, --loglevel=INFO, "--concurrency=${AI_WORKER_CONCURRENCY:-2}", --schedule=/tmp/ai-beat-schedule]
    deploy:
      resources:
        limits:
          memory: 1024M
    depends_on:
      ai-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A jobs.celery_app:celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 45s
      timeout: 10s
      retries: 3
      start_period: 30s

  ai-dispatcher:
    <<: *ai
    command: [python, -m, jobs.dispatcher]
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      ai-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
