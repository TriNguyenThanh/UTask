worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Trust the visitor header only when the TCP peer is a Cloudflare edge.
  # Official ranges verified 2026-10-19; review when Cloudflare updates them:
  # https://www.cloudflare.com/ips-v4 and https://www.cloudflare.com/ips-v6
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive off;

  # Local browser clients, including an HTML file opened with Origin: null.
  map "$host|$http_origin" $cors_origin {
    default "";
    "localhost|null" "null";
    "127.0.0.1|null" "null";
    "~^(localhost|127\.0\.0\.1)\|(http://(localhost|127\.0\.0\.1)(:[0-9]+)?)$" $2;
  }

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  # Replace caller-supplied forwarding headers with the validated address.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
  # Docker DNS resolves backends when requested, including services added later.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 2s;

  server {
    listen 80;
    server_name _;
    error_page 502 =503 /service-unavailable;

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Idempotency-Key, X-CSRFToken, X-Request-ID" always;
    add_header Access-Control-Expose-Headers "WWW-Authenticate, Retry-After, X-Request-ID" always;
    add_header Vary "Origin" always;

    location = /service-unavailable {
      internal;
      return 503;
    }

    # Internal Identity APIs are reachable only on the backend network with caller keys.
    location = /api/auth/api/v1/internal {
      return 404;
    }
    location ^~ /api/auth/api/v1/internal/ {
      return 404;
    }

    location /api/auth/ {
      if ($request_method = OPTIONS) { return 204; }
      set $identity_backend identity-service:8000;
      rewrite ^/api/auth/(.*)$ /$1 break;
      proxy_pass http://$identity_backend;
    }

    location /api/work/ {
      if ($request_method = OPTIONS) { return 204; }
      set $work_backend work-service:8000;
      rewrite ^/api/work/(.*)$ /$1 break;
      proxy_pass http://$work_backend;
    }

    location = /api/classroom/internal {
      return 404;
    }
    location ^~ /api/classroom/internal/ {
      return 404;
    }

    location /api/classroom/ {
      if ($request_method = OPTIONS) { return 204; }
      set $classroom_backend classroom-service:8000;
      rewrite ^/api/classroom/(.*)$ /$1 break;
      proxy_pass http://$classroom_backend;
    }

    location /api/integrations/ {
      set $integration_backend integration-service:8000;
      rewrite ^/api/integrations/(.*)$ /$1 break;
      proxy_pass http://$integration_backend;
    }

    location /api/notifications/ {
      set $notification_backend notification-service:8000;
      rewrite ^/api/notifications/(.*)$ /$1 break;
      proxy_pass http://$notification_backend;
    }

    location /api/ai/ {
      set $ai_backend ai-service:8000;
      rewrite ^/api/ai/(.*)$ /$1 break;
      proxy_pass http://$ai_backend;
    }
  }
}
