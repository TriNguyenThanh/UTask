worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;

  server {
    listen 80;
    server_name _;

    location /api/auth/ {
      rewrite ^/api/auth/(.*)$ /$1 break;
      proxy_pass http://identity-service:8000;
    }

    location /api/work/ {
      rewrite ^/api/work/(.*)$ /$1 break;
      proxy_pass http://work-service:8000;
    }

    location /api/classroom/ {
      rewrite ^/api/classroom/(.*)$ /$1 break;
      proxy_pass http://classroom-service:8000;
    }

    location /api/integrations/ {
      rewrite ^/api/integrations/(.*)$ /$1 break;
      proxy_pass http://integration-service:8000;
    }

    location /api/notifications/ {
      rewrite ^/api/notifications/(.*)$ /$1 break;
      proxy_pass http://notification-service:8000;
    }

    location /api/ai/ {
      rewrite ^/api/ai/(.*)$ /$1 break;
      proxy_pass http://ai-service:8000;
    }
  }
}
