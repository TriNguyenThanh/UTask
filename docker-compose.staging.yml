# UTask Staging Orchestrator (Docker Compose v2.20+ modular `include:`).
# Keep the existing project/volume names (`utask`) so staging servers switch
# without recreating data volumes.
# Single-VPS staging embeds Celery Beat (`worker -B`) inside each single-replica
# worker and runs migrations explicitly via `scripts/deploy_staging.sh` before
# rollout (zero persistent `*-migrate` containers). Multi-replica production
# MUST split standalone Beat singletons per official Celery guidance.
name: utask

include:
  - path: infra/compose/staging/infra.yml
    project_directory: .
  - path: infra/compose/staging/core.yml
    project_directory: .
  - path: infra/compose/staging/integration.yml
    project_directory: .
  - path: infra/compose/staging/notification.yml
    project_directory: .
  - path: infra/compose/staging/ai.yml
    project_directory: .

volumes:
  postgres_data:
  redis_data:
  kafka_data:
