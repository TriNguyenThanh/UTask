# Keep the existing project/volume names when switching staging to this file.
name: utask

# Work API and workers share one image, env mappings and database/cache dependencies.
x-work-runtime: &work_runtime
  profiles: [work-service]
  image: ${UTASK_IMAGE_PREFIX:?Set staging image prefix}/work-service:${UTASK_IMAGE_TAG:?Set release SHA tag}
  restart: unless-stopped
  env_file:
    - ./infra/env/database.env
    - ./infra/env/django.env
    - ./infra/env/work-service.env
  volumes: &kafka_certificates
    - type: bind
      source: ./infra/env
      target: /run/kafka-certificates
      read_only: true
  depends_on: &work_dependencies
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

x-identity-publisher: &identity_publisher
  profiles: [identity-service]
  image: ${UTASK_IMAGE_PREFIX:?Set staging image prefix}/identity-service:${UTASK_IMAGE_TAG:?Set release SHA tag}
  restart: unless-stopped
  x-deploy:
    role: worker
    application: identity-service
  env_file:
    - ./infra/env/database.env
    - ./infra/env/django.env
    - ./infra/env/identity-service.env
  volumes:
    - type: bind
      source: ${IDENTITY_JWT_PRIVATE_KEY_HOST_PATH:?Set the RSA private key path on the staging server}
      target: /run/identity-secrets/jwt-private.pem
      read_only: true
      bind:
        create_host_path: false
    - ./infra/env:/run/kafka-certificates:ro
  depends_on:
    identity-service:
      condition: service_healthy
    postgres:
      condition: service_healthy
  # Process liveness only; delivery and backlog need separate flow checks.
  healthcheck:
    test: ["CMD", "python", "-c", "from pathlib import Path; c = Path('/proc/1/cmdline').read_bytes().split(bytes([0])); raise SystemExit(not ({b'publish_identity_outbox', b'--watch'} <= set(c)))"]
    interval: 15s
    timeout: 5s
    retries: 6
    start_period: 15s

services:

  postgres:
    x-deploy:
      role: infrastructure
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./infra/env/database.env
      - ./infra/env/postgres.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    x-deploy:
      role: infrastructure
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    x-deploy:
      role: infrastructure
    profiles: [kafka]
    image: apache/kafka:3.9.0
    restart: unless-stopped
    env_file:
      - ./infra/env/kafka.env
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  identity-service:
    x-deploy:
      gateway_health_path: /api/auth/healthz
    x-ci:
      test_env:
        IDENTITY_TEST_DB_NAME: test_identity_ci
        IDENTITY_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    image: ${UTASK_IMAGE_PREFIX:?Set staging image prefix}/identity-service:${UTASK_IMAGE_TAG:?Set release SHA tag}
    restart: unless-stopped
    env_file:
      - ./infra/env/database.env
      - ./infra/env/django.env
      - ./infra/env/identity-service.env
    environment:
      IDENTITY_REDIS_URL: ${IDENTITY_REDIS_URL:-redis://redis:6379/0}
      IDENTITY_INTEGRATION_URL: ${IDENTITY_INTEGRATION_URL:-http://integration-service:8000}
    volumes:
      - type: bind
        source: ${IDENTITY_JWT_PRIVATE_KEY_HOST_PATH:?Set the RSA private key path on the staging server}
        target: /run/identity-secrets/jwt-private.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: &django_healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  identity-publisher:
    <<: *identity_publisher
    command: ["/app/.venv/bin/python", "manage.py", "publish_identity_outbox", "--watch"]

  work-service:
    <<: *work_runtime
    x-deploy:
      gateway_health_path: /api/work/healthz
    x-ci:
      test_env:
        WORK_TEST_DB_NAME: ci
        WORK_TEST_DATABASE: test_work_ci
        WORK_TEST_DB_USER: utask_ci
        WORK_TEST_DB_PASSWORD: ci-only-postgres-password
        WORK_TEST_DB_PORT: "5432"
    healthcheck: *django_healthcheck

  work-publisher:
    <<: *work_runtime
    x-deploy: &work_worker
      role: worker
      application: work-service
    command: ["celery", "-A", "config", "worker", "-Q", "work-publisher", "--concurrency=1"]
    depends_on:
      <<: *work_dependencies
      kafka:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect --timeout=3 --destination=celery@$$HOSTNAME ping"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s

  work-beat:
    <<: *work_runtime
    x-deploy: *work_worker
    command: ["celery", "-A", "config", "beat", "--pidfile=/tmp/work-beat.pid"]

    # Process/broker readiness only; scheduling and task delivery need flow tests.
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from pathlib import Path; from config.celery import app; os.kill(int(Path('/tmp/work-beat.pid').read_text()), 0); app.connection_for_write().ensure_connection(max_retries=0, timeout=3)"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s

  work-profile-consumer:
    <<: *work_runtime
    x-deploy: *work_worker
    profiles: [work-profile-consumer]
    command: ["python", "manage.py", "consume_identity"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false

  work-group-consumer:
    <<: *work_runtime
    x-deploy: *work_worker
    init: true
    command: ["python", "manage.py", "consume_classroom"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert any(p.read_bytes().split(b'\\0')[1:3] == [b'manage.py', b'consume_classroom'] for p in Path('/proc').glob('[0-9]*/cmdline'))"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s

  classroom-service:
    profiles: [classroom-service]
    x-deploy:
      gateway_health_path: /api/classroom/healthz
    x-ci:
      test_env:
        CLASSROOM_TEST_DB_NAME: ci
        CLASSROOM_TEST_DATABASE: test_classroom_ci
        CLASSROOM_TEST_DB_USER: utask_ci
        CLASSROOM_TEST_DB_PASSWORD: ci-only-postgres-password
        CLASSROOM_TEST_DB_HOST: "127.0.0.1"
        CLASSROOM_TEST_DB_PORT: "5432"
    image: ${UTASK_IMAGE_PREFIX:?Set staging image prefix}/classroom-service:${UTASK_IMAGE_TAG:?Set release SHA tag}
    init: true
    restart: unless-stopped
    env_file:
      - ./infra/env/database.env
      - ./infra/env/django.env
      - ./infra/env/classroom-service.env
    volumes: *kafka_certificates
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *django_healthcheck

  classroom-publisher:
    profiles: [classroom-service]
    x-deploy:
      role: worker
      application: classroom-service
    image: ${UTASK_IMAGE_PREFIX:?Set staging image prefix}/classroom-service:${UTASK_IMAGE_TAG:?Set release SHA tag}
    init: true
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-Q", "classroom-publisher", "--concurrency=1"]
    env_file:
      - ./infra/env/database.env
      - ./infra/env/django.env
      - ./infra/env/classroom-service.env
    volumes: *kafka_certificates
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect --timeout=3 --destination=celery@$$HOSTNAME ping"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s

  classroom-beat:
    profiles: [classroom-service]
    x-deploy:
      role: worker
      application: classroom-service
    image: ${UTASK_IMAGE_PREFIX:?Set staging image prefix}/classroom-service:${UTASK_IMAGE_TAG:?Set release SHA tag}
    init: true
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "--pidfile=/tmp/classroom-beat.pid"]
    env_file:
      - ./infra/env/database.env
      - ./infra/env/django.env
      - ./infra/env/classroom-service.env
    volumes: *kafka_certificates
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from pathlib import Path; from config.celery import app; os.kill(int(Path('/tmp/classroom-beat.pid').read_text()), 0); app.connection_for_write().ensure_connection(max_retries=0, timeout=3)"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s

  classroom-work-consumer:
    profiles: [classroom-service]
    x-deploy:
      role: worker
      application: classroom-service
    image: ${UTASK_IMAGE_PREFIX:?Set staging image prefix}/classroom-service:${UTASK_IMAGE_TAG:?Set release SHA tag}
    init: true
    restart: unless-stopped
    command: ["python", "manage.py", "consume_work"]
    env_file:
      - ./infra/env/database.env
      - ./infra/env/django.env
      - ./infra/env/classroom-service.env
    volumes: *kafka_certificates
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert any(p.read_bytes().split(b'\\0')[1:3] == [b'manage.py', b'consume_work'] for p in Path('/proc').glob('[0-9]*/cmdline'))"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s

  integration-service:
    profiles: [integration-service]
    init: true
    x-deploy:
      gateway_health_path: /api/integrations/healthz
    x-ci:
      test_env:
        INTEGRATION_TEST_DB_USER: utask_ci
        INTEGRATION_TEST_DB_PASSWORD: ci-only-postgres-password
        INTEGRATION_TEST_DB_NAME: integration_test
        TEST_DATABASE_NAME: integration_test
        INTEGRATION_TEST_DB_HOST: 127.0.0.1
        INTEGRATION_TEST_DB_PORT: "5432"
        INTEGRATION_REDIS_URL: redis://127.0.0.1:6379/15
    image: ${UTASK_IMAGE_PREFIX:?Set staging image prefix}/integration-service:${UTASK_IMAGE_TAG:?Set release SHA tag}
    restart: unless-stopped
    env_file:
      - ./infra/env/django.env
      - ./infra/env/integration-service.env
    volumes: *kafka_certificates
    environment:
      INTEGRATION_REDIS_URL: ${INTEGRATION_REDIS_URL:-redis://redis:6379/4}
    depends_on:
      integration-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *django_healthcheck

  integration-migrate:
    profiles: [integration-service]
    x-deploy:
      role: migration
      application: integration-service
    image: ${UTASK_IMAGE_PREFIX:?Set staging image prefix}/integration-service:${UTASK_IMAGE_TAG:?Set release SHA tag}
    init: true
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]
    env_file:
      - ./infra/env/django.env
      - ./infra/env/integration-service.env
    volumes: *kafka_certificates
    depends_on:
      postgres:
        condition: service_healthy

  integration-worker:
    profiles: [integration-service]
    x-deploy: &integration_worker
      role: worker
      application: integration-service
    image: ${UTASK_IMAGE_PREFIX:?Set staging image prefix}/integration-service:${UTASK_IMAGE_TAG:?Set release SHA tag}
    init: true
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "-Q", "integration", "--concurrency=1"]
    env_file:
      - ./infra/env/django.env
      - ./infra/env/integration-service.env
    volumes: *kafka_certificates
    environment:
      INTEGRATION_REDIS_URL: ${INTEGRATION_REDIS_URL:-redis://redis:6379/4}
    depends_on:
      integration-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect --timeout=3 --destination=celery@$$HOSTNAME ping"]
      interval: 15s
      timeout: 10s
      retries: 6

  integration-beat:
    profiles: [integration-service]
    x-deploy: *integration_worker
    image: ${UTASK_IMAGE_PREFIX:?Set staging image prefix}/integration-service:${UTASK_IMAGE_TAG:?Set release SHA tag}
    init: true
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "--pidfile=/tmp/integration-beat.pid", "--schedule=/tmp/integration-celerybeat"]
    env_file:
      - ./infra/env/django.env
      - ./infra/env/integration-service.env
    volumes: *kafka_certificates
    environment:
      INTEGRATION_REDIS_URL: ${INTEGRATION_REDIS_URL:-redis://redis:6379/4}
    depends_on:
      integration-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from pathlib import Path; os.kill(int(Path('/tmp/integration-beat.pid').read_text()), 0); Path('/tmp').is_dir()"]
      interval: 15s
      timeout: 10s
      retries: 6

  notification-service:
    profiles: [notification-service]
    image: ${UTASK_IMAGE_PREFIX:?Set staging image prefix}/notification-service:${UTASK_IMAGE_TAG:?Set release SHA tag}
    restart: unless-stopped
    env_file:
      - ./infra/env/database.env
      - ./infra/env/django.env
      - ./infra/env/notification-service.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *django_healthcheck

  ai-service:
    x-deploy:
      gateway_health_path: null
    init: true
    x-ci:
      test_env:
        TEST_DATABASE_NAME: ai_test
        TEST_DATABASE_URL: postgresql+psycopg://utask_ci:ci-only-postgres-password@127.0.0.1:5432/ai_test
        TEST_REDIS_URL: redis://127.0.0.1:6379/15
    profiles: [ai-service]
    image: &ai_image ${UTASK_IMAGE_PREFIX:?Set staging image prefix}/ai-service:${UTASK_IMAGE_TAG:?Set release SHA tag}
    restart: unless-stopped
    env_file: &ai_env_files
      - ./infra/env/ai-service.env
    environment: &ai_environment
      AI_ENVIRONMENT: ${AI_ENVIRONMENT:-staging}
      MOCK_TEST: ${MOCK_TEST:-false}
      AI_DATABASE_URL: ${AI_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${AI_DB_NAME:-ai_context_db}}
      AI_BROKER_URL: ${AI_BROKER_URL:-redis://redis:6379/1}
      AI_CREDENTIAL_KEY: ${AI_CREDENTIAL_KEY:-}
      AI_JWT_PUBLIC_KEY: ${AI_JWT_PUBLIC_KEY:-}
      AI_JWT_JWKS_URL: ${AI_JWT_JWKS_URL:-}
      AI_JWT_ISSUER: ${AI_JWT_ISSUER:-}
      AI_JWT_AUDIENCE: ${AI_JWT_AUDIENCE:-utask-ai}
      AI_JWT_ALGORITHM: ${AI_JWT_ALGORITHM:-RS256}
      AI_AUTHORIZATION_URLS: ${AI_AUTHORIZATION_URLS:-{}}
      AI_CONTEXT_URLS: ${AI_CONTEXT_URLS:-{}}
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-litellm}
      AI_MODEL: ${AI_MODEL:-}
      AI_LLM_API_KEY: ${AI_LLM_API_KEY:-}
      AI_LLM_API_BASE: ${AI_LLM_API_BASE:-}
    volumes: &ai_volumes
      - ./datasets:/app/datasets:ro
    depends_on: &ai_dependencies
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *django_healthcheck

  ai-worker:
    x-deploy: &ai_worker
      role: worker
      application: ai-service
    init: true
    profiles: [ai-service]
    image: *ai_image
    restart: unless-stopped
    env_file: *ai_env_files
    environment: *ai_environment
    volumes: *ai_volumes
    command: ["celery", "-A", "jobs.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=${AI_WORKER_CONCURRENCY:-2}"]
    depends_on:
      <<: *ai_dependencies
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A jobs.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout=5"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s

  ai-dispatcher:
    x-deploy: *ai_worker
    init: true
    profiles: [ai-service]
    image: *ai_image
    restart: unless-stopped
    env_file: *ai_env_files
    environment: *ai_environment
    volumes: *ai_volumes
    command: ["python", "-m", "jobs.dispatcher"]
    depends_on:
      <<: *ai_dependencies
      ai-service:
        condition: service_healthy
    # Process liveness only; delivery readiness requires an end-to-end check.
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert any(p.read_bytes().split(b'\\0')[1:3] == [b'-m', b'jobs.dispatcher'] for p in Path('/proc').glob('[0-9]*/cmdline'))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

  nginx:
    x-deploy:
      role: gateway
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${UTASK_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && nc -z -w 3 127.0.0.1 80"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  ai_database:
