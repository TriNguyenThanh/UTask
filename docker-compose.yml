name: utask

# Work API and workers share one image, build, env mappings and volume certificates.
x-work: &work
  image: ${UTASK_IMAGE_PREFIX:-utask}/work-service:${UTASK_IMAGE_TAG:-local}
  build: ./apps/work-service
  init: true
  restart: unless-stopped
  env_file:
    - ./infra/env/database.env
    - ./infra/env/django.env
    - ./infra/env/work-service.env
  volumes: &kafka_certificates
    - type: bind
      source: ./infra/env
      target: /run/kafka-certificates
      read_only: true

# Classroom API and workers share one image, build, env mappings and volume certificates.
x-classroom: &classroom
  image: ${UTASK_IMAGE_PREFIX:-utask}/classroom-service:${UTASK_IMAGE_TAG:-local}
  build: ./apps/classroom-service
  init: true
  restart: unless-stopped
  env_file:
    - ./infra/env/database.env
    - ./infra/env/django.env
    - ./infra/env/classroom-service.env
  volumes: *kafka_certificates

# Một image cho các process thuộc AI Service.
x-ai: &ai
  profiles: [ai-service]
  image: ${UTASK_IMAGE_PREFIX:-utask}/ai-service:${UTASK_IMAGE_TAG:-local}
  build: ./apps/ai-service
  restart: unless-stopped
  init: true
  env_file:
    - ./infra/env/ai-service.env
  environment:
    AI_ENVIRONMENT: ${AI_ENVIRONMENT:-local}
    MOCK_TEST: ${MOCK_TEST:-false}
    AI_DATABASE_URL: ${AI_DATABASE_URL:-postgresql+psycopg://ai_service:${AI_DB_PASSWORD:-}@ai-postgres:5432/ai_context_db}
    AI_BROKER_URL: ${AI_BROKER_URL:-redis://redis:6379/1}
    AI_CREDENTIAL_KEY: ${AI_CREDENTIAL_KEY:-}
    AI_JWT_PUBLIC_KEY: ${AI_JWT_PUBLIC_KEY:-}
    AI_JWT_JWKS_URL: ${AI_JWT_JWKS_URL:-}
    AI_JWT_ISSUER: ${AI_JWT_ISSUER:-}
    AI_JWT_AUDIENCE: ${AI_JWT_AUDIENCE:-utask-ai}
    AI_JWT_ALGORITHM: ${AI_JWT_ALGORITHM:-RS256}
    AI_AUTHORIZATION_URLS: ${AI_AUTHORIZATION_URLS:-{}}
    AI_CONTEXT_URLS: ${AI_CONTEXT_URLS:-{}}
    AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-litellm}
    AI_MODEL: ${AI_MODEL:-}
    AI_LLM_API_KEY: ${AI_LLM_API_KEY:-}
    AI_LLM_API_BASE: ${AI_LLM_API_BASE:-}
  extra_hosts:
    - host.docker.internal:host-gateway

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:55432:5432"
    env_file:
      - ./infra/env/database.env
      - ./infra/env/postgres.env
    entrypoint: ["/bin/sh", "/usr/local/bin/start-postgres.sh"]
    command: ["postgres"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/start-postgres.sh:/usr/local/bin/start-postgres.sh:ro
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/utask-postgres-ready && pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 150s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    profiles: [kafka]
    image: apache/kafka:3.9.0
    restart: unless-stopped
    env_file:
      - ./infra/env/kafka.env
      - ./infra/env/kafka-startup.env
    command: ["/bin/sh", "/opt/kafka/start-kafka.sh"]
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./infra/kafka/start-kafka.sh:/opt/kafka/start-kafka.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/utask-kafka-ready && /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 120s

  identity-service:
    image: ${UTASK_IMAGE_PREFIX:-utask}/identity-service:${UTASK_IMAGE_TAG:-local}
    build: ./apps/identity-service
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - ./infra/env/database.env
      - ./infra/env/django.env
      - ./infra/env/identity-service.env
    environment:
      IDENTITY_REDIS_URL: ${IDENTITY_REDIS_URL:-redis://redis:6379/0}
      IDENTITY_INTEGRATION_URL: ${IDENTITY_INTEGRATION_URL:-http://integration-service:8000}
    volumes:
      - type: bind
        source: ${IDENTITY_JWT_PRIVATE_KEY_HOST_PATH:-./.local-secrets/identity-jwt-private.pem}
        target: /run/identity-secrets/jwt-private.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: &django_healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  work-service:
    <<: *work
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *django_healthcheck

  work-publisher:
    <<: *work
    command: ["celery", "-A", "config", "worker", "-Q", "work-publisher", "--concurrency=1"]
    depends_on:
      work-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect --timeout=3 --destination=celery@$$HOSTNAME ping"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s

  work-beat:
    <<: *work
    command: ["celery", "-A", "config", "beat", "--pidfile=/tmp/work-beat.pid"]
    depends_on:
      work-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from pathlib import Path; from config.celery import app; os.kill(int(Path('/tmp/work-beat.pid').read_text()), 0); app.connection_for_write().ensure_connection(max_retries=0, timeout=3)"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s

  work-profile-consumer:
    <<: *work
    profiles: [work-profile-consumer]
    command: ["python", "manage.py", "consume_identity"]
    depends_on:
      work-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false

  work-group-consumer:
    <<: *work
    command: ["python", "manage.py", "consume_classroom"]
    depends_on:
      work-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert any(p.read_bytes().split(b'\\0')[1:3] == [b'manage.py', b'consume_classroom'] for p in Path('/proc').glob('[0-9]*/cmdline'))"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s

  classroom-service:
    <<: *classroom
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *django_healthcheck

  classroom-publisher:
    <<: *classroom
    command: ["celery", "-A", "config", "worker", "-Q", "classroom-publisher", "--concurrency=1"]
    depends_on:
      classroom-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect --timeout=3 --destination=celery@$$HOSTNAME ping"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s

  classroom-beat:
    <<: *classroom
    command: ["celery", "-A", "config", "beat", "--pidfile=/tmp/classroom-beat.pid"]
    depends_on:
      classroom-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from pathlib import Path; from config.celery import app; os.kill(int(Path('/tmp/classroom-beat.pid').read_text()), 0); app.connection_for_write().ensure_connection(max_retries=0, timeout=3)"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s

  classroom-work-consumer:
    <<: *classroom
    command: ["python", "manage.py", "consume_work"]
    depends_on:
      classroom-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert any(p.read_bytes().split(b'\\0')[1:3] == [b'manage.py', b'consume_work'] for p in Path('/proc').glob('[0-9]*/cmdline'))"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s

  integration-service:
    profiles: [integration-service]
    image: ${UTASK_IMAGE_PREFIX:-utask}/integration-service:${UTASK_IMAGE_TAG:-local}
    build: ./apps/integration-service
    init: true
    restart: unless-stopped
    env_file:
      - ./infra/env/django.env
      - ./infra/env/integration-service.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *django_healthcheck

  notification-service:
    profiles: [notification-service]
    image: ${UTASK_IMAGE_PREFIX:-utask}/notification-service:${UTASK_IMAGE_TAG:-local}
    build: ./apps/notification-service
    restart: unless-stopped
    env_file:
      - ./infra/env/database.env
      - ./infra/env/django.env
      - ./infra/env/notification-service.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *django_healthcheck

  ai-postgres:
    profiles: [ai-service]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_service
      POSTGRES_DB: ai_context_db
      POSTGRES_PASSWORD: ${AI_DB_PASSWORD:-}
    volumes:
      - ai_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-migrate:
    <<: *ai
    restart: "no"
    command: [alembic, upgrade, head]
    depends_on:
      ai-postgres:
        condition: service_healthy

  ai-service:
    <<: *ai
    volumes:
      - ./datasets:/app/datasets:ro
    depends_on:
      ai-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  ai-worker:
    <<: *ai
    command: ["celery", "-A", "jobs.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=${AI_WORKER_CONCURRENCY:-2}"]
    depends_on:
      ai-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A jobs.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout=5"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s

  ai-dispatcher:
    <<: *ai
    command: [python, -m, jobs.dispatcher]
    depends_on:
      ai-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert any(p.read_bytes().split(b'\\0')[1:3] == [b'-m', b'jobs.dispatcher'] for p in Path('/proc').glob('[0-9]*/cmdline'))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${UTASK_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && nc -z -w 3 127.0.0.1 80"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  ai_database:
