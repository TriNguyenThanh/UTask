name: utask

# Một image cho các process thuộc AI Service.
x-ai: &ai
  profiles: [ ai-service ]
  image: ${UTASK_IMAGE_PREFIX:-utask}/ai-service:${UTASK_IMAGE_TAG:-local}
  build: ./apps/ai-service
  restart: unless-stopped
  init: true
  env_file:
    - ./infra/env/ai-service.env
  extra_hosts:
    - host.docker.internal:host-gateway

# Một image và ánh xạ môi trường cho các process thuộc Work Service.
x-work-runtime: &work_runtime
  image: ${UTASK_IMAGE_PREFIX:-utask}/work-service:${UTASK_IMAGE_TAG:-local}
  build: ./apps/work-service
  restart: unless-stopped
  env_file:
    - ./infra/env/database.env
    - ./infra/env/django.env
    - ./infra/env/work-service.env
  depends_on: &work_dependencies
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

# Một image, init và ánh xạ môi trường cho các process thuộc Classroom Service.
x-classroom-runtime: &classroom_runtime
  image: ${UTASK_IMAGE_PREFIX:-utask}/classroom-service:${UTASK_IMAGE_TAG:-local}
  build: ./apps/classroom-service
  init: true
  restart: unless-stopped
  env_file:
    - ./infra/env/database.env
    - ./infra/env/django.env
    - ./infra/env/classroom-service.env
  depends_on: &classroom_dependencies
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

# Các process Identity dùng chung image và ánh xạ môi trường.
x-identity-runtime: &identity_runtime
  image: ${UTASK_IMAGE_PREFIX:-utask}/identity-service:${UTASK_IMAGE_TAG:-local}
  build: ./apps/identity-service
  restart: unless-stopped
  env_file:
    - ./infra/env/database.env
    - ./infra/env/django.env
    - ./infra/env/identity-service.env

x-identity-publisher: &identity_publisher
  <<: *identity_runtime
  profiles: [identity-service]
  volumes:
    - type: bind
      source: ${IDENTITY_JWT_PRIVATE_KEY_HOST_PATH:-./.local-secrets/identity-jwt-private.pem}
      target: /run/identity-secrets/jwt-private.pem
      read_only: true
    - ./infra/env:/run/kafka-certificates:ro
  depends_on:
    identity-service:
      condition: service_healthy
    postgres:
      condition: service_healthy
  # Process liveness only; delivery and backlog need separate flow checks.
  healthcheck:
    test: ["CMD", "python", "-c", "from pathlib import Path; c = Path('/proc/1/cmdline').read_bytes().split(bytes([0])); raise SystemExit(not ({b'publish_identity_outbox', b'--watch'} <= set(c)))"]
    interval: 15s
    timeout: 5s
    retries: 6
    start_period: 15s

x-kafka-certificates: &kafka_certificates
  - type: bind
    source: ./infra/env
    target: /run/kafka-certificates
    read_only: true

# Integration API, migration and workers share the same image and env mappings.
x-integration-runtime: &integration_runtime
  profiles: [integration-service]
  image: ${UTASK_IMAGE_PREFIX:-utask}/integration-service:${UTASK_IMAGE_TAG:-local}
  build: ./apps/integration-service
  init: true
  restart: unless-stopped
  env_file:
    - ./infra/env/django.env
    - ./infra/env/integration-service.env
  volumes: *kafka_certificates
  environment:
    INTEGRATION_REDIS_URL: ${INTEGRATION_REDIS_URL:-redis://redis:6379/4}

x-integration-dependencies: &integration_dependencies
  integration-migrate:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

# Notification API and background processes share image, env and dependencies.
x-notification-runtime: &notification_runtime
  profiles: [notification-service]
  image: ${UTASK_IMAGE_PREFIX:-utask}/notification-service:${UTASK_IMAGE_TAG:-local}
  build: ./apps/notification-service
  init: true
  restart: unless-stopped
  env_file:
    - ./infra/env/database.env
    - ./infra/env/django.env
    - ./infra/env/notification-service.env
  volumes: *kafka_certificates
  depends_on: &notification_dependencies
    notification-migrate:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:55432:5432"
    env_file:
      - ./infra/env/database.env
      - ./infra/env/postgres.env
    entrypoint: [ "/bin/sh", "/usr/local/bin/start-postgres.sh" ]
    command: [ "postgres" ]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/start-postgres.sh:/usr/local/bin/start-postgres.sh:ro
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "test -f /tmp/utask-postgres-ready && pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 150s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    profiles: [ kafka ]
    image: apache/kafka:3.9.0
    restart: unless-stopped
    env_file:
      - ./infra/env/kafka.env
      - ./infra/env/kafka-startup.env
    command: [ "/bin/sh", "/opt/kafka/start-kafka.sh" ]
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./infra/kafka/start-kafka.sh:/opt/kafka/start-kafka.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "test -f /tmp/utask-kafka-ready && /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 120s

  identity-service:
    <<: *identity_runtime
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - type: bind
        source: ${IDENTITY_JWT_PRIVATE_KEY_HOST_PATH:-./.local-secrets/identity-jwt-private.pem}
        target: /run/identity-secrets/jwt-private.pem
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: &django_healthcheck
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  identity-publisher:
    <<: *identity_publisher
    command: ["/app/.venv/bin/python", "manage.py", "publish_identity_outbox", "--watch"]

  work-service:
    <<: *work_runtime
    healthcheck: *django_healthcheck

  work-publisher:
    <<: *work_runtime
    command: [ "celery", "-A", "config", "worker", "-Q", "work-publisher", "--concurrency=1" ]
    depends_on:
      <<: *work_dependencies
      work-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false

  work-beat:
    <<: *work_runtime
    command: [ "celery", "-A", "config", "beat" ]
    depends_on:
      <<: *work_dependencies
      work-service:
        condition: service_healthy

  work-consumer:
    <<: *work_runtime
    init: true
    stop_grace_period: 15s
    command: [ "python", "manage.py", "consume_work" ]
    depends_on:
      work-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    healthcheck:
      test: [ "CMD", "python", "-c", "from pathlib import Path; assert any(p.read_bytes().split(b'\\0')[1:3] == [b'manage.py', b'consume_work'] for p in Path('/proc').glob('[0-9]*/cmdline'))" ]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s

  classroom-service:
    <<: *classroom_runtime
    healthcheck: *django_healthcheck

  classroom-publisher:
    <<: *classroom_runtime
    command: [ "celery", "-A", "config", "worker", "-Q", "classroom-publisher", "--concurrency=1" ]
    depends_on:
      <<: *classroom_dependencies
      classroom-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    healthcheck:
      test: [ "CMD-SHELL", "celery -A config inspect --timeout=3 --destination=celery@$$HOSTNAME ping" ]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s

  classroom-beat:
    <<: *classroom_runtime
    command: [ "celery", "-A", "config", "beat", "--pidfile=/tmp/classroom-beat.pid" ]
    depends_on:
      <<: *classroom_dependencies
      classroom-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import os; from pathlib import Path; from config.celery import app; os.kill(int(Path('/tmp/classroom-beat.pid').read_text()), 0); app.connection_for_write().ensure_connection(max_retries=0, timeout=3)" ]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s

  classroom-work-consumer:
    <<: *classroom_runtime
    command: [ "python", "manage.py", "consume_work" ]
    depends_on:
      <<: *classroom_dependencies
      classroom-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    healthcheck:
      test: [ "CMD", "python", "-c", "from pathlib import Path; assert any(p.read_bytes().split(b'\\0')[1:3] == [b'manage.py', b'consume_work'] for p in Path('/proc').glob('[0-9]*/cmdline'))" ]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s

  integration-service:
    <<: *integration_runtime
    x-deploy:
      role: application
      gateway_health_path: /api/integrations/healthz
    x-ci:
      test_env:
        INTEGRATION_TEST_DB_USER: utask_ci
        INTEGRATION_TEST_DB_PASSWORD: ci-only-postgres-password
        INTEGRATION_TEST_DB_NAME: integration_test
        TEST_DATABASE_NAME: integration_test
        INTEGRATION_TEST_DB_HOST: 127.0.0.1
        INTEGRATION_REDIS_URL: redis://127.0.0.1:6379/15
    depends_on:
      <<: *integration_dependencies
    healthcheck: *django_healthcheck

  integration-migrate:
    <<: *integration_runtime
    x-deploy:
      role: migration
      application: integration-service
    restart: "no"
    command: [ "python", "manage.py", "migrate", "--noinput" ]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import sys; sys.exit(0)" ]
      interval: 1s
      timeout: 1s
      retries: 1

  integration-worker:
    <<: *integration_runtime
    x-deploy: &integration_worker
      role: worker
      application: integration-service
    command: [ "celery", "-A", "config", "worker", "-Q", "integration", "--concurrency=1" ]
    depends_on:
      <<: *integration_dependencies
      kafka:
        condition: service_healthy
        required: false
    healthcheck:
      test: [ "CMD-SHELL", "celery -A config inspect --timeout=3 --destination=celery@$$HOSTNAME ping" ]
      interval: 15s
      timeout: 10s
      retries: 6

  integration-beat:
    <<: *integration_runtime
    x-deploy: *integration_worker
    command: [ "celery", "-A", "config", "beat", "--pidfile=/tmp/integration-beat.pid", "--schedule=/tmp/integration-celerybeat" ]
    depends_on:
      <<: *integration_dependencies
    healthcheck:
      test: [ "CMD", "python", "-c", "import os; from pathlib import Path; os.kill(int(Path('/tmp/integration-beat.pid').read_text()), 0); Path('/tmp').is_dir()" ]
      interval: 15s
      timeout: 10s
      retries: 6

  notification-service:
    <<: *notification_runtime
    healthcheck: *django_healthcheck

  notification-migrate:
    <<: *notification_runtime
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    x-deploy:
      role: migration
      application: notification-service

  notification-worker:
    <<: *notification_runtime
    command: ["celery", "-A", "config", "worker", "-Q", "notification", "--concurrency=1"]
    x-deploy: &notification_worker
      role: worker
      application: notification-service
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect --timeout=3 --destination=celery@$$HOSTNAME ping"]
      interval: 15s
      timeout: 10s
      retries: 6

  notification-beat:
    <<: *notification_runtime
    command: ["celery", "-A", "config", "beat", "--pidfile=/tmp/notification-beat.pid", "--schedule=/tmp/notification-celerybeat"]
    x-deploy: *notification_worker
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from pathlib import Path; os.kill(int(Path('/tmp/notification-beat.pid').read_text()), 0)"]
      interval: 15s
      timeout: 10s
      retries: 6

  notification-identity-consumer:
    <<: *notification_runtime
    depends_on: &notification_consumer_dependencies
      <<: *notification_dependencies
      kafka:
        condition: service_healthy
        required: false
    command: ["python", "manage.py", "consume_notifications", "--source", "identity"]
    x-deploy: *notification_worker
    healthcheck: &notification_consumer_health
      test: ["CMD", "python", "-c", "from pathlib import Path; assert any(b'consume_notifications' in p.read_bytes().split(bytes([0])) for p in Path('/proc').glob('[0-9]*/cmdline'))"]
      interval: 15s
      timeout: 10s
      retries: 6

  notification-work-consumer:
    <<: *notification_runtime
    depends_on: *notification_consumer_dependencies
    command: ["python", "manage.py", "consume_notifications", "--source", "work"]
    x-deploy: *notification_worker
    healthcheck: *notification_consumer_health

  ai-service:
    <<: *ai
    volumes:
      - ./datasets:/app/datasets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  ai-worker:
    <<: *ai
    command: [ celery, -A, jobs.celery_app:celery_app, worker, --loglevel=INFO, "--concurrency=${AI_WORKER_CONCURRENCY:-2}" ]
    depends_on:
      ai-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "celery -A jobs.celery_app:celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ai-dispatcher:
    <<: *ai
    command: [ python, -m, jobs.dispatcher ]
    depends_on:
      ai-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-beat:
    <<: *ai
    command: [ celery, -A, jobs.celery_app:celery_app, beat, --loglevel=INFO, --schedule=/tmp/ai-beat-schedule, --pidfile=/tmp/ai-beat.pid ]
    depends_on:
      ai-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import os; from pathlib import Path; os.kill(int(Path('/tmp/ai-beat.pid').read_text()), 0)" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${UTASK_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      identity-service:
        condition: service_healthy
      work-service:
        condition: service_healthy
      classroom-service:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  kafka_data:
