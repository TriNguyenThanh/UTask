name: utask

# Một image cho các process thuộc AI Service.
x-ai: &ai
  profiles: [ ai-service ]
  image: ${UTASK_IMAGE_PREFIX:-utask}/ai-service:${UTASK_IMAGE_TAG:-local}
  build: ./apps/ai-service
  restart: unless-stopped
  init: true
  env_file:
    - ./infra/env/ai-service.env
  environment:
    AI_DATABASE_URL: ${AI_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${AI_DB_NAME:-ai_context_db}}
    AI_BROKER_URL: redis://redis:6379/1
    AI_CREDENTIAL_KEY: ${AI_CREDENTIAL_KEY:-}
    AI_IDENTITY_BASE_URL: ${AI_IDENTITY_BASE_URL:-http://identity-service:8000}
    AI_IDENTITY_SERVICE_KEY: ${AI_IDENTITY_SERVICE_KEY:-}
    AI_LLM_API_KEY: ${AI_LLM_API_KEY:-}
    AI_WORK_SERVICE_AUTH_ENABLED: ${AI_WORK_SERVICE_AUTH_ENABLED:-false}
    AI_WORK_SERVICE_KEY: ${AI_WORK_SERVICE_KEY:-}
    AI_INTEGRATION_SERVICE_KEY: ${AI_INTEGRATION_SERVICE_KEY:-}
  extra_hosts:
    - host.docker.internal:host-gateway

x-identity-publisher: &identity_publisher
  profiles: [identity-service]
  image: ${UTASK_IMAGE_PREFIX:-utask}/identity-service:${UTASK_IMAGE_TAG:-local}
  build: ./apps/identity-service
  restart: unless-stopped
  env_file:
    - ./infra/env/database.env
    - ./infra/env/django.env
    - ./infra/env/identity-service.env
  volumes:
    - type: bind
      source: ${IDENTITY_JWT_PRIVATE_KEY_HOST_PATH:-./.local-secrets/identity-jwt-private.pem}
      target: /run/identity-secrets/jwt-private.pem
      read_only: true
    - ./infra/env:/run/kafka-certificates:ro
  depends_on:
    identity-service:
      condition: service_healthy
    postgres:
      condition: service_healthy
  # Process liveness only; delivery and backlog need separate flow checks.
  healthcheck:
    test: ["CMD", "python", "-c", "from pathlib import Path; c = Path('/proc/1/cmdline').read_bytes().split(bytes([0])); raise SystemExit(not ({b'publish_identity_outbox', b'--watch'} <= set(c)))"]
    interval: 15s
    timeout: 5s
    retries: 6
    start_period: 15s

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:55432:5432"
    env_file:
      - ./infra/env/database.env
      - ./infra/env/postgres.env
    entrypoint: [ "/bin/sh", "/usr/local/bin/start-postgres.sh" ]
    command: [ "postgres" ]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/start-postgres.sh:/usr/local/bin/start-postgres.sh:ro
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "test -f /tmp/utask-postgres-ready && pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 150s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    profiles: [ kafka ]
    image: apache/kafka:3.9.0
    restart: unless-stopped
    env_file:
      - ./infra/env/kafka.env
      - ./infra/env/kafka-startup.env
    command: [ "/bin/sh", "/opt/kafka/start-kafka.sh" ]
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./infra/kafka/start-kafka.sh:/opt/kafka/start-kafka.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "test -f /tmp/utask-kafka-ready && /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 120s

  identity-service:
    image: ${UTASK_IMAGE_PREFIX:-utask}/identity-service:${UTASK_IMAGE_TAG:-local}
    build: ./apps/identity-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - ./infra/env/database.env
      - ./infra/env/django.env
      - ./infra/env/identity-service.env
    volumes:
      - type: bind
        source: ${IDENTITY_JWT_PRIVATE_KEY_HOST_PATH:-./.local-secrets/identity-jwt-private.pem}
        target: /run/identity-secrets/jwt-private.pem
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: &django_healthcheck
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  identity-publisher:
    <<: *identity_publisher
    command: ["/app/.venv/bin/python", "manage.py", "publish_identity_outbox", "--watch"]

  work-service:
    image: ${UTASK_IMAGE_PREFIX:-utask}/work-service:${UTASK_IMAGE_TAG:-local}
    build: ./apps/work-service
    restart: unless-stopped
    env_file:
      - ./infra/env/database.env
      - ./infra/env/django.env
      - ./infra/env/work-service.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *django_healthcheck

  work-publisher:
    image: ${UTASK_IMAGE_PREFIX:-utask}/work-service:${UTASK_IMAGE_TAG:-local}
    build: ./apps/work-service
    restart: unless-stopped
    command: [ "celery", "-A", "config", "worker", "-Q", "work-publisher", "--concurrency=1" ]
    env_file:
      - ./infra/env/database.env
      - ./infra/env/django.env
      - ./infra/env/work-service.env
    depends_on:
      work-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false

  work-beat:
    image: ${UTASK_IMAGE_PREFIX:-utask}/work-service:${UTASK_IMAGE_TAG:-local}
    build: ./apps/work-service
    restart: unless-stopped
    command: [ "celery", "-A", "config", "beat" ]
    env_file:
      - ./infra/env/database.env
      - ./infra/env/django.env
      - ./infra/env/work-service.env
    depends_on:
      work-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  work-consumer:
    image: ${UTASK_IMAGE_PREFIX:-utask}/work-service:${UTASK_IMAGE_TAG:-local}
    build: ./apps/work-service
    restart: unless-stopped
    env_file:
      - ./infra/env/database.env
      - ./infra/env/django.env
      - ./infra/env/work-service.env
    init: true
    stop_grace_period: 15s
    command: [ "python", "manage.py", "consume_work" ]
    depends_on:
      work-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    healthcheck:
      test: [ "CMD", "python", "-c", "from pathlib import Path; assert any(p.read_bytes().split(b'\\0')[1:3] == [b'manage.py', b'consume_work'] for p in Path('/proc').glob('[0-9]*/cmdline'))" ]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s

  classroom-service:
    image: ${UTASK_IMAGE_PREFIX:-utask}/classroom-service:${UTASK_IMAGE_TAG:-local}
    build: ./apps/classroom-service
    init: true
    restart: unless-stopped
    env_file:
      - ./infra/env/database.env
      - ./infra/env/django.env
      - ./infra/env/classroom-service.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *django_healthcheck

  classroom-publisher:
    image: ${UTASK_IMAGE_PREFIX:-utask}/classroom-service:${UTASK_IMAGE_TAG:-local}
    build: ./apps/classroom-service
    init: true
    restart: unless-stopped
    command: [ "celery", "-A", "config", "worker", "-Q", "classroom-publisher", "--concurrency=1" ]
    env_file:
      - ./infra/env/database.env
      - ./infra/env/django.env
      - ./infra/env/classroom-service.env
    depends_on:
      classroom-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    healthcheck:
      test: [ "CMD-SHELL", "celery -A config inspect --timeout=3 --destination=celery@$$HOSTNAME ping" ]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s

  classroom-beat:
    image: ${UTASK_IMAGE_PREFIX:-utask}/classroom-service:${UTASK_IMAGE_TAG:-local}
    build: ./apps/classroom-service
    init: true
    restart: unless-stopped
    command: [ "celery", "-A", "config", "beat", "--pidfile=/tmp/classroom-beat.pid" ]
    env_file:
      - ./infra/env/database.env
      - ./infra/env/django.env
      - ./infra/env/classroom-service.env
    depends_on:
      classroom-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import os; from pathlib import Path; from config.celery import app; os.kill(int(Path('/tmp/classroom-beat.pid').read_text()), 0); app.connection_for_write().ensure_connection(max_retries=0, timeout=3)" ]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s

  classroom-work-consumer:
    image: ${UTASK_IMAGE_PREFIX:-utask}/classroom-service:${UTASK_IMAGE_TAG:-local}
    build: ./apps/classroom-service
    init: true
    restart: unless-stopped
    command: [ "python", "manage.py", "consume_work" ]
    env_file:
      - ./infra/env/database.env
      - ./infra/env/django.env
      - ./infra/env/classroom-service.env
    depends_on:
      classroom-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    healthcheck:
      test: [ "CMD", "python", "-c", "from pathlib import Path; assert any(p.read_bytes().split(b'\\0')[1:3] == [b'manage.py', b'consume_work'] for p in Path('/proc').glob('[0-9]*/cmdline'))" ]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 15s

  integration-service:
    profiles: [ integration-service ]
    init: true
    x-deploy:
      role: application
      gateway_health_path: /api/integrations/healthz
    x-ci:
      test_env:
        INTEGRATION_TEST_DB_USER: utask_ci
        INTEGRATION_TEST_DB_PASSWORD: ci-only-postgres-password
        INTEGRATION_TEST_DB_NAME: integration_test
        TEST_DATABASE_NAME: integration_test
        INTEGRATION_TEST_DB_HOST: 127.0.0.1
        INTEGRATION_REDIS_URL: redis://127.0.0.1:6379/15
    image: ${UTASK_IMAGE_PREFIX:-utask}/integration-service:${UTASK_IMAGE_TAG:-local}
    build: ./apps/integration-service
    restart: unless-stopped
    env_file:
      - ./infra/env/django.env
      - ./infra/env/integration-service.env
    volumes: &integration_kafka_certificates
      - type: bind
        source: ./infra/env
        target: /run/kafka-certificates
        read_only: true
    environment:
      INTEGRATION_REDIS_URL: ${INTEGRATION_REDIS_URL:-redis://redis:6379/4}
    depends_on:
      integration-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: *django_healthcheck

  integration-migrate:
    profiles: [ integration-service ]
    x-deploy:
      role: migration
      application: integration-service
    image: ${UTASK_IMAGE_PREFIX:-utask}/integration-service:${UTASK_IMAGE_TAG:-local}
    build: ./apps/integration-service
    init: true
    restart: "no"
    command: [ "python", "manage.py", "migrate", "--noinput" ]
    env_file:
      - ./infra/env/django.env
      - ./infra/env/integration-service.env
    volumes: *integration_kafka_certificates
    environment:
      INTEGRATION_REDIS_URL: ${INTEGRATION_REDIS_URL:-redis://redis:6379/4}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import sys; sys.exit(0)" ]
      interval: 1s
      timeout: 1s
      retries: 1

  integration-worker:
    profiles: [ integration-service ]
    x-deploy: &integration_worker
      role: worker
      application: integration-service
    image: ${UTASK_IMAGE_PREFIX:-utask}/integration-service:${UTASK_IMAGE_TAG:-local}
    build: ./apps/integration-service
    init: true
    restart: unless-stopped
    command: [ "celery", "-A", "config", "worker", "-Q", "integration", "--concurrency=1" ]
    env_file:
      - ./infra/env/django.env
      - ./infra/env/integration-service.env
    volumes: *integration_kafka_certificates
    environment:
      INTEGRATION_REDIS_URL: ${INTEGRATION_REDIS_URL:-redis://redis:6379/4}
    depends_on:
      integration-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
    healthcheck:
      test: [ "CMD-SHELL", "celery -A config inspect --timeout=3 --destination=celery@$$HOSTNAME ping" ]
      interval: 15s
      timeout: 10s
      retries: 6

  integration-beat:
    profiles: [ integration-service ]
    x-deploy: *integration_worker
    image: ${UTASK_IMAGE_PREFIX:-utask}/integration-service:${UTASK_IMAGE_TAG:-local}
    build: ./apps/integration-service
    init: true
    restart: unless-stopped
    command: [ "celery", "-A", "config", "beat", "--pidfile=/tmp/integration-beat.pid", "--schedule=/tmp/integration-celerybeat" ]
    env_file:
      - ./infra/env/django.env
      - ./infra/env/integration-service.env
    volumes: *integration_kafka_certificates
    environment:
      INTEGRATION_REDIS_URL: ${INTEGRATION_REDIS_URL:-redis://redis:6379/4}
    depends_on:
      integration-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import os; from pathlib import Path; os.kill(int(Path('/tmp/integration-beat.pid').read_text()), 0); Path('/tmp').is_dir()" ]
      interval: 15s
      timeout: 10s
      retries: 6

  notification-service:
    profiles: [ notification-service ]
    image: ${UTASK_IMAGE_PREFIX:-utask}/notification-service:${UTASK_IMAGE_TAG:-local}
    build: ./apps/notification-service
    restart: unless-stopped
    env_file:
      - ./infra/env/database.env
      - ./infra/env/django.env
      - ./infra/env/notification-service.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck: *django_healthcheck

  ai-service:
    <<: *ai
    volumes:
      - ./datasets:/app/datasets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  ai-worker:
    <<: *ai
    command: [ celery, -A, jobs.celery_app:celery_app, worker, --loglevel=INFO, --concurrency=2 ]
    depends_on:
      ai-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "celery -A jobs.celery_app:celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  ai-dispatcher:
    <<: *ai
    command: [ python, -m, jobs.dispatcher ]
    depends_on:
      ai-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-beat:
    <<: *ai
    command: [ celery, -A, jobs.celery_app:celery_app, beat, --loglevel=INFO, --schedule=/tmp/ai-beat-schedule, --pidfile=/tmp/ai-beat.pid ]
    depends_on:
      ai-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import os; from pathlib import Path; os.kill(int(Path('/tmp/ai-beat.pid').read_text()), 0)" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${UTASK_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      identity-service:
        condition: service_healthy
      work-service:
        condition: service_healthy
      classroom-service:
        condition: service_healthy

volumes:
  ai_database:
  postgres_data:
  redis_data:
  kafka_data:
