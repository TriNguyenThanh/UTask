# UTask Local Development Orchestrator (Docker Compose v2.20+ modular `include:`).
# Default `docker compose up --build -d` starts 5 core containers:
#   postgres, redis, nginx, core-service, core-worker.
# Enable optional stacks on demand via COMPOSE_PROFILES or `--profile`:
#   kafka | integration-service | notification-service | ai-service
name: utask

include:
  - path: infra/compose/infra.yml
    project_directory: .
  - path: infra/compose/core.yml
    project_directory: .
  - path: infra/compose/integration.yml
    project_directory: .
  - path: infra/compose/notification.yml
    project_directory: .
  - path: infra/compose/ai.yml
    project_directory: .

volumes:
  postgres_data:
  redis_data:
  kafka_data:
